  <text x="24" y="752" font-size="11" fill="#64758a">读图：① 一条总线 + 5 段支线；② 仅 2 条直连；③ agc_task 分发主干 + 两条横向通道；④ 是出界依赖，短标签在框内。</text>
  <text x="24" y="767" font-size="11" fill="#64758a">易错：agc_task → 域包是 ③ 不是 ②；agc_control 是 ② 唯一例外；px4_msgs 是内联第三方、不是第 9 个包；agc_sim 不依赖 agc_msgs。</text>
