# 感知通道变体：fov（R-026 承载 `perception=fov` 正例）
#
# 与 config/perception_sensors.yaml（nominal，标称 FOV）对照：本文件**收窄视场角**
# （hfov_deg: 30 / vfov_deg: 20），使目标偏出视场时 air_perception 观测**缺失**
# （R-026 fov 轴正例）；drop_prob 保持 0（只变化 FOV 因子）。
#   ⇒ 量程必须与 perception_sensors.yaml **逐值相同**（2026-11-03 起同为 30.0，
#     依据见该文件头「range_max_m 的依据」）；不同步会把对照臂变成"量程也变了"的混淆实验。
# ⚠ **2026-11-04 起本文件不再影响 `/agc/targets`（如实登记）。**
#   它只被 `air_perception` 读取，而 `air_fusion` 退役后 `/agc/air/obs` **无订阅者**；
#   唯一的 `/agc/targets` 发布者 `gt_adapter` **无几何门控、不分远近**。
#   ⇒ 本变体与 `perception_sensors.yaml` 在**运行期行为完全相同**
#   （`scenario_carriers.yaml` 的 `fov` 档已逐档标注「已知缺陷」）。
#   保留原因：用户裁定 `air_perception` 后续会有用到的地方。
# 诚实口径：真值派生感知仿真，非真实传感器标定（ADR-0009）。
sensors:
  - id: air_eo_front
    sigma_xy_m: 0.10
    sigma_z_m: 0.12
    latency_s: 0.0
    drop_prob: 0.0
    confidence: 1.0                   # 链路可信度（声明值，非精度；见 confidence.hpp）
    boresight_body: [1.0, 0.0, 0.0]
    hfov_deg: 30.0                    # 收窄（正例）
    vfov_deg: 20.0
    range_min_m: 0.30
    range_max_m: 30.0
    corr_xy: 0.0
    noise_tau_s: 0.0
    bias_m: [0.0, 0.0, 0.0]
    drop_burst_prob: 0.0
    drop_burst_mean_s: 0.5
    drop_burst_mean_gap_s: 5.0
  - id: air_ir_top
    sigma_xy_m: 0.20
    sigma_z_m: 0.25
    latency_s: 0.0
    drop_prob: 0.0
    confidence: 1.0                   # 链路可信度（声明值，非精度；见 confidence.hpp）
    boresight_body: [1.0, 0.0, -0.10]
    hfov_deg: 30.0
    vfov_deg: 20.0
    range_min_m: 0.30
    range_max_m: 30.0
    corr_xy: 0.0
    noise_tau_s: 0.0
    bias_m: [0.0, 0.0, 0.0]
    drop_burst_prob: 0.0
    drop_burst_mean_s: 0.5
    drop_burst_mean_gap_s: 5.0

perception_model:
  occlusion:
    enabled: false
    pad_m: 0.0
