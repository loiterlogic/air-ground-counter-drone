# 感知通道变体：no_target（N3 回归矩阵「无目标负例」的**原始载体**）
#
# ⚠ **2026-11-04 起本文件不再产生任何效果（如实登记，不要据此宣称负例成立）。**
#   它只被 `air_perception` 读取，而 `air_fusion` 退役后 `/agc/air/obs` **没有订阅者**；
#   `/agc/targets` 的唯一发布者 `gt_adapter` **无几何门控**。⇒ 把视场收到 0.1° 也造不出
#   「看不见」，本文件当前属**保留但空转**。`s17` 因此标 `unsupported:perception`，
#   并从回归矩阵移除（见 `scenario_carriers.yaml` 的 `no_target.reason`）。
#   恢复需给 `gt_adapter` 加可致盲开关，属**新决策、未立项**。
#
# 用途（仅当将来恢复通道链路时）：回答"目标**不在视场内**时，系统会不会凭空造出航迹并导向成功"。
#
# 做法：把两道通道的视场收窄到**近乎为零**（hfov/vfov = 0.1°），并且**只改视场**——
#       sigma / latency / drop_prob / range 与 `perception_sensors.yaml` **逐值相同**，
#       诚实口径不变（真值派生感知仿真，非真实传感器标定，ADR-0009）。
#   ⇒ 目标的**真值仍在**（世界里有、`/agc/gt/**` 照常发布），但 air_perception 的
#     `gatePoint` 会恒以 `kFovAz` / `kFovEl` 拒绝 → 不产生任何 TargetObservation →
#     `/agc/targets` 无航迹。
#
# 判据（见 tests/run_n3_matrix.py 的负例断言）：
#   * 任务**不得**达到 `TRACKING_SUCCESS` / `INTERCEPT_CONFIRMED`（那是"假成功"）；
#   * 应停在 `AIR_SEARCH` 并由 T_max 超时落 `MISSION_FAILED(TIMEOUT)`（C4）；
#   * 若出现终态成功，即为**回归**——说明感知门控失效或存在虚构航迹。
#
# 为什么不用"删掉目标"来实现负例：删目标会同时改掉世界与 `scenario_reset` 的净空校验，
# 变量不单一；收窄 FOV 只动感知一个因子，符合"一次一个自变量"。
sensors:
  - id: air_eo_front
    sigma_xy_m: 0.10
    sigma_z_m: 0.12
    latency_s: 0.0
    drop_prob: 0.0
    confidence: 1.0                   # 链路可信度（声明值，非精度；见 confidence.hpp）
    boresight_body: [1.0, 0.0, 0.0]
    hfov_deg: 0.1                     # **负例**：近乎零视场 → 恒拒
    vfov_deg: 0.1
    range_min_m: 0.30
    range_max_m: 30.0
    corr_xy: 0.0
    noise_tau_s: 0.0
    bias_m: [0.0, 0.0, 0.0]
    drop_burst_prob: 0.0
    drop_burst_mean_s: 0.5
    drop_burst_mean_gap_s: 5.0
  - id: air_ir_top
    sigma_xy_m: 0.20
    sigma_z_m: 0.25
    latency_s: 0.0
    drop_prob: 0.0
    confidence: 1.0                   # 链路可信度（声明值，非精度；见 confidence.hpp）
    boresight_body: [1.0, 0.0, -0.10]
    hfov_deg: 0.1                     # **负例**：同上
    vfov_deg: 0.1
    range_min_m: 0.30
    range_max_m: 30.0
    corr_xy: 0.0
    noise_tau_s: 0.0
    bias_m: [0.0, 0.0, 0.0]
    drop_burst_prob: 0.0
    drop_burst_mean_s: 0.5
    drop_burst_mean_gap_s: 5.0

perception_model:
  occlusion:
    enabled: false
    pad_m: 0.0
