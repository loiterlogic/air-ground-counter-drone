# 感知与融合参数——**唯一参数来源**
#
# 由 `perception_bringup.launch.py` 经 launch 单一注入；节点不得覆写（契约 [参数入口]）。
# 契约参数名 → 本文件节点参数映射：
# `/agc/target/source` → gt_adapter.target_source（air_fusion 已退役）
# `/agc/obstacles/source` → map_adapter（值只折入内容身份 hash，不控制加载分支；
#   /agc/map 内容完全来自 nadir_projection 发布的 /agc/obstacles 感知观测，无静态先验回退）
#
# 2026-11-06：`/agc/perception/sensors_file` 契约项随 `air_perception` 与 `perception`
# 场景轴一并退役（无消费者），本文件不再有对应节点段。

gt_bypass:
  ros__parameters:
    world_frame: "world"
    world_name: "agc_world"
    gz_topic: "/world/agc_world/dynamic_pose/info"
    out_topic_prefix: "/agc/gt/"
    entities: ["agc_car", "intruder_uav"]
    rate_hz: 30.0

ground_odom_adapter:
  ros__parameters:
    world_frame: "world"
    base_frame: "car/base_link"
    gt_topic: "/agc/gt/agc_car"
    odom_topic: "/agc/ground/odom"
    valid_topic: "/agc/ground/odom_valid"
    # （ADR-0017）：诊断话题（latched std_msgs/String，state / age / epoch；非 ABI）
    diag_topic: "/agc/ground/odom_diag"
    # reset epoch 源（与 scenario_reset 一致，Int32 transient_local）→ 速度历史清空
    reset_epoch_topic: "/agc/scenario/reset_epoch"
    rate_hz: 30.0
    diff_window_s: 0.15
    odom_max_age_s: 0.5
    # 相邻真值样本位移跳变阈值（m）；超过即视为 teleport → 速度历史清空
    reset_jump_clear_m: 0.5

gt_adapter:
  ros__parameters:
    world_frame: "world"
    target_model: "intruder_uav"
    target_id: "intruder_uav"
    gt_topic: "/agc/gt/intruder_uav"
    target_topic: "/agc/targets"
    target_source: "gt_adapter"      # 契约 /agc/target/source（launch 可覆写）
    rate_hz: 10.0
    diff_window_s: 0.15
    # ---- 2026-11-03：真值链路的不确定性模型 ----
    # 缺省全 0 = **理想基线**，行为与旧版等价（节点启动时会打 WARN 提示不得据此宣称鲁棒性）。
    # 说明见 ADR-0009 的 #top（2026-11-04 已回填）。
    sigma_xy_m: 0.3                  # 位置噪声（m）；只进协方差与融合权重 [nominal 档]
    sigma_z_m: 0.3
    latency_s: 0.2                   # 交付延迟（s）；改交付时刻，不改源采样时刻 [nominal 档]
    drop_prob: 0.1                   # 单拍独立丢包 [nominal 档]
    drop_burst_prob: 0.0             # 成簇丢失（两态马尔可夫）
    drop_burst_mean_s: 0.5
    drop_burst_mean_gap_s: 5.0
    # 链路**可信度**（声明值，非精度）：2026-11-03 语义解耦，见 confidence.hpp 文件头。
    # 真值通道的航迹按定义为真 ⇒ 1.0。要检验下游 confidence_min 门，改本值。
    confidence: 1.0
    # 精度容差（**仅诊断**）：给定 σ，误差落在 tol 内的概率。不参与 confidence。
    confidence_tolerance_m: 0.25
    seed: "0"                        # 字符串（避免 yaml 求值成 int）
    # α-β 滤波器（位置加噪 → 速度估计）：σ_w 为目标机动强度（m/s²）。
    # σ_p ≤ 1e-6 时**自动旁路**（零噪声下 α=1,β=2 会退化为二阶振荡，见 gt_adapter.cpp）。
    filter_enabled: true
    filter_sigma_w_mps2: 0.5
    # ---- 兼容旧参数名（**仅当 sigma_xy_m ≤ 0 时**作为回退读取）----
    # 旧 `pose_std_m` / `twist_std_m` 只填协方差、不产生噪声，属"装饰参数"；
    # 保留键以免既有实验配置静默失效，但**不再**是噪声配置文件。
    pose_std_m: 0.0
    twist_std_m: 0.0
# ---- 已退役路线（用户裁定）----
# * 2026-11-04：视觉定位路径（`camera_tf` / `vision_target` / `perception_path`）整体删除；
# `air_fusion` 节点与参数段删除。项目不做目标识别，目标位置始终由真值给出（ADR-0009 (a2)）。
# * 2026-11-06：`air_perception` 节点与本节参数段删除。它在 `air_fusion` 退役后发布的
# `/agc/air/obs` 恒无订阅者，`sensors_file` 通道配置亦不再影响任何运行期行为。
# `/agc/targets` 的发布者**恒为** `gt_adapter`；`/agc/obstacles` 由 `nadir_projection`
# 发布，`map_adapter` 以其为 `/agc/map` 的唯一障碍来源（无静态先验回退）。
# 防复活闸门见 scripts/tests/test_retirement_ledger.py；台账见治理规范。

# ---- · 地图 ----
map_adapter:
  ros__parameters:
    world_frame: "world"
    rate_hz: 2.0
    map_topic: "/agc/map"
    # `dynamic_max_age_s` / `obstacles_file` 已随静态先验与动态轨集合退役（ADR-0035 (b)）：
    # 栅格内容只来自 log-odds 累积层，这两个参数不再有消费者，节点也不再声明它们。
    source_max_age_s: 1.0        # /agc/obstacles 源静默超过此值 → /agc/map/valid=false（知识时效）
    # （ADR-0007）：场景/源版本（折入内容身份 hash / 由 launch 按场景派生注入）；单调更新序号诊断话题
    scenario_version: ""
    update_seq_topic: "/agc/map/update_seq"
    # map_file / obstacles_file / obstacles_source 由 launch 注入
    # ---- 碎片合并：**已退役**（2026-11-08 用户裁定 Q7，批次 3）----
    # 合并层的唯一产出就是那个外接框；框删除后合并层失去存在理由，
    # 且它与"逐点落格 + log-odds 累积"是两套冲突表示。
    # 同帧碎片在栅格层天然合并（落在同一个连通证据里），不需要物体级打包。
    # ---- log-odds 增量累积（2026-11-08 用户裁定）----
    # **证据单位 = 每格每帧一次**（2026-11-09 用户裁定）：一帧有成千上万个足迹点，
    # 而一个 0.5 m 格通常覆盖大量像素。按点计数会让证据强度取决于像素采样密度，
    # 边缘格在门限两侧反复翻转（实测 |Δoccupied| p99 = 140，判据 ≤50）。
    # 现在同一格同一帧最多一次 hit、一次负证据，且同帧 hit 优先于 miss。
    # 替代"每帧重算 OBB 再栅格化"：场景不确定、不可能每次扫清地图，单帧只看到碎片
    # （实测 42 个障碍 0 个能拍全、38 个在视场外）。改为累积"这格被反复观测为占据"的证据：
    #   * 观测到的格 +hit；本帧未观测的格缓慢 −miss（不清零，容忍画幅边缘切掉）
    #   * 只有累积置信度 ≥ occupied_threshold 才画成 occupied ⇒ 单帧毛刺画不出来
    # p_hit/p_miss 沿用 ego-planner 工程经验（plan_env/src/grid_map.cpp）。
    # occupied_threshold=0.60：从 p_init=0.30 起步需约 2 次连续命中才跨过。
    log_odds_p_hit: 0.70
    # **2026-11-09 修正**：此处曾写 0.35，而头文件默认值与设计推导都是 0.25 ——
    # 运行时实际注入 0.35，比设计依据的负证据更强，occupied 格更容易被 carve 擦掉，
    # 同一障碍格在 hit/miss 之间反复切换。注释、默认值、YAML、推导必须一致。
    log_odds_p_miss: 0.25
    log_odds_occupied_threshold: 0.60
    # 全局时间衰减（与 p_miss 分开）：p_miss 是"射线穿过"的真实负证据；
    # 我们的全局衰减是"本帧没看到"的时间流逝，几乎无信息量，力度必须更小。
    # p_decay=0.48 维持占据只需 9% 观测占空比（用 0.35 需 42%，边缘格达不到 → 框边界漂移）。
    log_odds_p_decay: 0.48
    # ---- 发布值量化（2026-11-09）----
    # 中间概率按此步长量化后再比较/发布。否则任一格从 48 变 47 就让整图"变化"
    # 并重新发布。1 = 不量化（逐字节比较，旧口径）。0/100/-1 不受影响。
    #
    # **口径边界（不得误用）**：`perception_quality.py` 把 1–99 一律算 unknown，
    # 只有 99/中间值 ↔ 100 的跨门限翻转才影响稳定性 p99。所以 deadband 改善的是
    # **消息与 hash 的更新频率**，**不是**稳定性指标 —— 调大它不能替代 occupied
    # 状态稳定机制（证据单位去重 + 迟滞按地图帧推进）。
    publish_deadband: 5
    # ---- 多分辨率：证据层 / 规划层分离（ADR-0040）----
    # **问题**：dense_map 的障碍是 box 0.6–1.2 m、cylinder r 0.25–0.40 m，而 /agc/map
    # 只有 0.5 m 格 ⇒ 一个小圆柱只覆盖 1–2 格，边界点稍一偏移就让相邻格被占据。
    # 面积比已从 1.801 降到 1.230，误覆盖率却仍是 0.668 —— 剩余误差不是"地图整体膨胀"，
    # 而是**一个格只能回答 0 或 100，回答不了"这格只占 31%"**。
    #
    # 现在 0.5 m 只做**规划消费格式**：证据累积在 perception_resolution，规划层由它
    # **派生**（max-pool + 保守四态合并）。/agc/map 的话题 / 消息 / 几何 / 四态语义
    # **完全不变**，下游无需改动。
    #
    # **必须是 map.yaml 的 resolution 的整数分之一**（默认 0.5 / 0.25 = 2）。
    # 非整数倍（如 0.5/0.2 = 2.5）会让聚合重复计入或漏计、错位随坐标漂移，
    # 节点会**拒绝启动**（而不是静默用非整数倍跑）。
    # 取 0.25 而不是 0.20 的理由：0.6 m box 在 0.25 m 下覆盖 2–3 格、0.5 m 直径圆柱
    # 覆盖 2 格（改造前 1–2 格），且 2×2 与 0.5 m 格点严格对齐、无需重采样。
    perception_resolution: 0.25
    # 证据层地图话题（ADR-0042）。`/agc/map` 是**规划层**（含风险分档 + max-pool），
    # 这里是**几何层**（裸 log-odds 四态，分辨率 = perception_resolution）。
    # 评价必须在这条上做：拿规划层量几何精度等于把安全膨胀记成感知误差。
    # **两者语义不同，不得互相替代**：`/agc/map` 回答"能不能走"，
    # `/agc/map/evidence` 回答"看到多少"。
    evidence_map_topic: "/agc/map/evidence"
    # 逐格元数据话题（ADR-0042）。`OccupancyGrid.data` 每格只能装一个 int8，
    # 装不下 temp.md 要的"占据比例 0.31 / 置信度 0.78 / 最近观测 0.2 s /
    # 来源实例 17 / 完整可见 false"这五个量 —— 所以单开一条话题。
    # **与 `/agc/map` 的分工**：`/agc/map` 回答"能不能走"（一个数），
    # 这条回答"这一格是什么状态"（五个数）。评价与可视化用它，规划仍用 `/agc/map`。
    cell_meta_topic: "/agc/map/cell_meta"
    # 规划层安全膨胀（**米**，不是格）。与 agc_ground/config/costmap.yaml 的
    # robot_radius: 0.6 / inflation_radius: 1.0 同值 —— 两个消费者对"车多大、让多远"
    # 必须同口径，否则规划与安全层的净空不一致。
    # **为什么不用格数**：参照实现里 ego-planner 的 inf_step = ceil(0.099/0.1) = 1 格
    # 是**分辨率绑定**的；换到 0.5 m 就静默变成 0.5 m 余量（2.5 倍设计意图）。
    # Nav2 的 computeCost(distance) 才是与分辨率无关的写法，本仓按它做。
    # ---- 规划风险图（ADR-0041，temp.md 方向四 C）----
    # `/agc/map` 不再输出"裸占据"，而是**风险分档**：几何占据 + 米制安全膨胀
    # 共同决定这一格该不该禁止通行。理由（temp.md 原话）：`100 = occupied`
    # 同时承担"感知认为这里有障碍"与"规划器必须不可通行"两种语义，
    # 而对 0.5 m 格里的小障碍这两者不该等价。
    #
    # 取值：-1 未知 / 0 可通行 / 1–98 有代价 / 99 车心进入即擦碰 / 100 格内占据。
    # **消费端注意**：Nav2 `static_layer` 必须设 `trinary_costmap: false`，
    # 否则它把 1–98 折成 free（见 agc_ground/config/costmap.yaml 的同名注释）。
    # false 仅用于对照（退回 ADR-0040 的裸占据输出），主链默认 true。
    risk_enabled: true
    # 代价随距离的衰减系数（与 Nav2 computeCost 的指数形式同构，值本仓自定）。
    # 越大 ⇒ 靠近车半径时代价上升越陡，规划器越早开始绕。
    risk_cost_scaling: 3.0
    # ---- 障碍实例层（ADR-0041，temp.md 方向三）----
    # 实例层与逐点累积**取并集**：逐点累积能跨帧合并被画幅切碎的大建筑，
    # 实例层能稳定 1–3 格宽的小障碍。两者各补对方拿不到的那一半。
    instances_enabled: true
    # 至少被观测到这么多帧才算"已确认"（与 min_hits_for_occupied 同一纪律：
    # 单帧毛刺不得进地图）。
    instance_confirm_hits: 2
    # 连续这么多帧没有观测支撑才判死（一次漏检不得撤销确认）。
    instance_expire_misses: 3
    # 关联门（m）：超过它就不匹配、新建实例。取 1.5 —— dense_map 的最小障碍间距
    # 是 2.645 m（ADR-0044），取 1.5 m 不会把相邻障碍并成一个。
    instance_associate_gate_m: 1.5
    # 实例轨迹历史（ADR-0042）：每个实例最多保留这么多历史点；0 = 不记录
    # （退回"只存当前几何"的旧行为）。50 @10 Hz ≈ 5 s，486 个障碍约 0.6 MB。
    # **历史只读、不参与栅格化**：栅格化用当前几何。让历史影响栅格
    # 等于让"它曾经在哪"决定"现在哪格被占"，那是把记忆当观测。
    instance_track_points: 50
    # ---- 逐点不确定度门控（ADR-0042，temp.md 方向二）----
    # σ > ratio × 证据层格宽 的点不进 hit 证据。0 = 关闭（退回"所有点一视同仁"）。
    # **按格宽而不是按固定米数**：不确定度的意义是"这个点可能落到隔壁格"，
    # 而"隔壁"由格宽定义。写死 0.125 m 会在换分辨率时静默改变严格程度。
    # 取 0.5 = 半个格宽，与 ADR-0039 的"错位超半格则本帧不给正证据"同一条纪律
    # （那条用帧级错位量，这条用逐点误差）。
    # 发布端不提供协方差时**不拦**（旧行为逐字不变，不静默收紧）。
    sigma_reject_ratio: 0.5
    inflation_robot_radius_m: 0.6
    inflation_radius_m: 1.0
    # ---- 视野外不衰减（2026-11-09）----
    # decayMiss() 此前每帧对全图衰减，与"是否在视场内"无关 —— 视野外的真实障碍
    # 也被持续削弱，"没被看到"于是被当成"变空了"，形成消失—重现周期。
    # true = 只有本帧画幅覆盖的格才允许时间衰减；画幅无效时退回全图衰减。
    decay_inside_footprint_only: true
    # ---- occupied 的生命周期（2026-11-10，ADR-0039）----
    # **误覆盖率的直接根因**：此前已确认占据的格**永不因时间退出** ——
    # `markStale` 对 `p >= occupied_threshold` 的格直接跳过，只能靠射线 carving 擦。
    # 而 dense_map 的误 hit 大量落在画幅外 / 遮挡区 / 射线没穿过的位置，carving 够不到
    # ⇒ 错误 occupied 永久驻留（实测误覆盖 0.727、面积比 1.801）。
    #
    # 现在的三段语义：
    #   occupied + 最近有正向 hit                          → 保持
    #   occupied + 超过 occupied_expire_s 没有正向 hit      → 按 p_decay 削弱，退出 occupied
    #   射线明确穿过（observeMiss / 强 carve）              → 才允许降到 free
    # **退出 occupied 后只降到 unknown，不降 free**：我们只是"很久没再看到它"，
    # 并没有"看到它是空的"。降 free 是对规划器的过度承诺。
    occupied_expire_s: 3.0
    # 纯时间流逝削弱的下限（概率）。必须**高于** free_threshold(0.20)：
    # 时间衰减不得把格子推成 free，free 只能由真实射线穿过给出。
    unknown_floor_p: 0.22
    # ---- 小障碍的空间/时间支持门槛（2026-11-10，ADR-0039）----
    # 单帧内一个格至少有这么多独立足迹点才进 hit 证据（1 = 关闭）。
    # dense_map 的障碍 0.6–1.2 m 宽，0.5 m 格下只有 1–3 格；单个错位点跨两帧就能
    # 建成 occupied，而大建筑同格内有成百上千点 —— 旧判据无法区分两者。
    min_hit_points_per_cell: 3
    # 单格足迹点 z 极差上限（m）：超过即判"混了两种表面"（屋顶+侧墙、障碍+地面）。
    # 0.5 m 格内的 XY 散布天然被格宽限住、判不出东西；z 才反映"是不是同一平面"。
    max_hit_z_spread_m: 1.5
    # ---- 深度一致性：稳健判据（2026-11-10，ADR-0039 补正）----
    # 极差只能抓"混了两种表面"，抓不到"整片偏移但局部连续"，且对单个离群点过于敏感。
    # 现在再判一次稳健一致性：IQR 主判 + "多数点落在 floor 内"兜底。
    # **为什么不用 MAD 当主判据**：实测证明 MAD 在双峰数据（同格一半屋顶一半地面）上
    # 会自我失效 —— 中位数落在两簇中间、各点距离相同 ⇒ MAD 等于两簇间距的一半，
    # 任何"tol ∝ MAD"的判据都被自身撑大到恒真。IQR 双峰时必然大、对少数离群点稳健。
    depth_mad_k: 3.0
    depth_consistency_floor_m: 0.30
    # ---- 标签↔深度错位的**残余不确定度**（2026-11-10，ADR-0039 补正）----
    # 投影端已按位移补偿掉主体错位，这里处理**残余**：用相邻 odom 样本估速度，
    # 不确定度 = 速度 × 时间残差。**超过半格时本帧不给正证据** ——
    # 错位在帧内是**相关**误差（整帧一起平移），帧内点数再多也抵不掉，只有跨帧能抵消。
    # 阈值固定为 res/2（不设参数：它是"点可能整体偏出本格"的几何分界，不是可调旋钮）。
    # 进入 occupied 需要累计的**跨帧** hit 次数（1 = 只靠概率门限）。
    # 写成独立的门，是为了让"调 p_hit / 调门限"无法静默绕过"至少两帧"。
    min_hits_for_occupied: 2
    # 遮挡体最低置信度：carving 只被这么可信的格终止。低于它的格射线可以穿过，
    # 但只施加弱负证据（不判 free）—— 那里很可能就是这个方向的小障碍。
    occluder_min_confidence: 0.60
    # 相机位姿按**足迹帧时间戳**查询/插值（与 nadir_projection 同口径）。
    # 超出容差即不做负证据（宁可少标安全，也不要用错时刻的位姿乱标）。
    odom_pair_tolerance_s: 0.15
    odom_buffer_n: 120
    # ---- free-space carving（2026-11-08 用户裁定 Q3：本次的根因修复）----
    # 只有"障碍点"观测时，地图**只能单调生长**：旧形状永不擦除，物体移动/视角变化
    # 留下的残影永久驻留 —— 这正是"障碍面积只增不减、形状一直在变"的根因。
    # 有了相机地面投影，就能对「相机 → 障碍近边」的射线途经格打**真实负证据**（observeMiss）。
    # 参照 ego-planner plan_env/src/raycast.cpp（同思路，本仓降到 2D）。
    #
    # carve_enabled=false 仅用于对照（关闭后地图退回"只增不减"的旧行为）。
    carve_enabled: true
    # 射程上限（m）；0 = 不限。UAV 高 14 m、覆盖 30 m 时远处格的深度误差已 > 格宽 0.5 m，
    # 射线方向不可信；需要收紧时给正值。
    carve_max_range_m: 0.0
    # 相机地面投影来源（与 nadir_projection 同源，保证射线起点与观测同坐标系）。
    odom_topic: "/agc/air/odom"
    # 足迹点话题（2026-11-08 用户裁定 Q7/Q28）：与 /agc/obstacles **并行**消费。
    # 为什么并行：批次 3 才删框（那时 OBB 话题一并退役）；现在替换会让批次 2/3 耦合。
    # 并行期两路都喂累积层，同一格被两路看到只是多一次 hit（log-odds 天然去重），
    # 不会产生两倍障碍。
    footprint_topic: "/agc/obstacle_footprints"

# ---- 正下视语义分割 + 深度 → 障碍 3D 点 → 2D 占据观测 ----
# 相机与机体外参来自 /agc/air/odom（world 系位姿）+ 已知固定安装，不依赖 TF 树；
# 内参来自分割相机自身的 /agc/air/nadir/seg/camera_info（gz 实测发布，与 RGBD 共位姿共内参）。
#
# 2026-11-08：**必须**有深度图才能出观测。原因：分割标签只说"这个像素是障碍"，
# 不说"多高"；把标签像素投到地面平面 z=0 会把高层建筑的**侧墙**当成地面点，
# 按 H/(H−h) 向外放大（yard 实测整图 IoU 0.363、面积膨胀 2.17×，视觉上就是"影子"）。
# 无深度时本节点**跳过**该帧并告警，不退回地面投影——错误的地图比暂时没有地图更危险。
nadir_projection:
  ros__parameters:
    labels_topic: "/agc/air/nadir/seg/labels_map"
    depth_topic: "/agc/air/nadir/depth"          # rgbd 的 depth_image（32FC1，轴向深度）
    camera_info_topic: "/agc/air/nadir/seg/camera_info"
    odom_topic: "/agc/air/odom"
    obstacles_topic: "/agc/obstacles"
    # 足迹点话题（2026-11-08 用户裁定 Q7/Q28）：**逐点**而非外接框。
    # 为什么：规划真正需要的是"哪些格被占据"；用 AABB/OBB 表达会引入两重误差
    # （旋转矩形对 L 形/多栋/斜置实体必然包大，实测框面积/真实足迹 1.65×；
    # 且框边界随"连通域恰好切在哪"跳变）。直接传点，地面侧按格累积，表示误差归零。
    # 与 /agc/obstacles **并行**发布：批次 3 删框之后，本话题成为唯一障碍输出。
    footprint_topic: "/agc/obstacle_footprints"
    world_frame: "world"
    obstacle_label: 10            # 与 world_bringup.OBSTACLE_SEG_LABEL 一致
    # 连通域最小尺寸（2026-11-08 用户裁定 Q26：像素 → **物理量**）。
    # 判据：横截面小于 min_obstacle_side_m 的碎片不进地图。
    # 为什么改成物理量：固定像素数会让判据**随飞行高度漂移** —— 飞低了 GSD 变小，
    # 同样的像素门限对应更小的物理尺寸 ⇒ 突然多出一堆 0.05 m 碎片；飞高了细杆被静默吞掉。
    # 自主定高上线后，"20 px" 不再有唯一物理解释。
    # 换算：min_area_px = (min_obstacle_side_m / GSD)²，GSD = H/f 由当前相机高度实时算。
    # 缺省 0.24 m 沿用改造前口径（640×480@100°、H=14.24 m 时恰为 20 px）。
    # 代价（已登记）：横截面 < 0.24 m 的细杆（灯杆/门柱/消防栓）不进 /agc/map，
    # 改由车的激光在 20 m 内局部感知——这是**平台分工**，不是能力丢失。
    min_obstacle_side_m: 0.24
    # ---- 屋顶带过滤（2026-11-08 用户裁定 Q8）----
    # 正下视里一栋楼同时有**屋顶**（稳定=足迹）与**侧墙**（可见性随视角/噪声变）。
    # 侧墙进 XY 包络后，同一物体 sx 在 2.50..3.05 m 间变（真实屋顶 2.0 m）。
    # 只保留 z 接近屋顶平面的点；门限 = max(0.25 m, 0.15 × 障碍高度)。
    # 绝对下限托住矮障碍（薄板只有十几厘米高，按比例会算出 0 门限把顶面剔光）；
    # 比例项自适应高楼（10 m 楼允许 1.5 m 屋顶起伏：女儿墙/设备间）。
    # **方法的固有边界**：墙与屋顶在交界处 z 相同、XY 也相同，任何纯 z 判据都分不开；
    # 能剔除的是墙的**主体**（实测跨度 2.90 m → 1.20 m，抑制 59%）。
    roof_band_floor_m: 0.25
    roof_band_ratio: 0.15
    # 跨帧关联门（m）：连通域帧间会分裂/合并，碎片与母体质心差可达 2 m 量级；
    # 门太小会让碎片被判成新目标，每帧新增/消失约 1.2 个 id（实测）。
    assoc_gate_m: 2.5
    # ---- 形状稳健估计（2026-11-08 Q1 丙）----
    # 形状抖动的根因是**参与聚合的点集每帧变化**（屋顶稳定、侧墙可见性随深度噪声变），
    # 实测同物体 sx 在 2.50..3.05 m 间变，偶尔某帧侧墙整片断开 → 形状大幅跳再回归。
    # 用"中位数 + MAD 剔除离群"：离群帧直接丢弃不污染输出，真实渐变仍被跟随。
    # window_n=10（30 Hz 下 0.33 s）；mad_k=3.0（|x−中位| > 3·MAD 判离群，取 3 避免误杀渐变）。
    shape_window_n: 10
    shape_mad_k: 3.0
    # 标签（segmentation）与深度（rgbd）来自**两个传感器**，靠时间戳配对。
    # 实测偏差 p50=32 ms / p95=196 ms / max=364 ms（只有 ~51% 精确同戳），
    # 故**不能**按"同一次渲染"假设设成毫秒级。
    # 取值由几何判据定：错位造成的地面位移须 < 半格 0.25 m，
    # 地面 GSD=5.30 cm/px、UAV 最大 2.0 m/s ⇒ dt ≤ 0.125 s；取 0.10 s（实测覆盖率 100%，
    # 最坏错位 0.20 m = 3.8 px）。
    # 2026-11-09：相机降到 10 Hz（带宽约束，见 model.sdf），一个帧间隔就是 0.10 s，
    # 原容差 0.10 s 正好卡在边界（实测 0.132 s 的 WARN 会常态化）。放宽到 0.15 s。
    # 几何判据仍成立：UAV 最大 2.0 m/s ⇒ 错位 0.15×2.0 = 0.30 m ≈ 半格 0.25 m（略超，
    # 但地图格 0.5 m、且深度图本身有噪声；这是"可接受的最坏错位"，不是精确保证）。
    depth_pair_tolerance_s: 0.15
    # ---- 时间错位补偿（2026-11-10，ADR-0039）----
    # 容差只是"允许配对"，**不等于"错位无害"**：0.15 s × 2 m/s = 0.30 m，
    # 而 dense_map 的障碍只有 0.6–1.2 m 宽、栅格 0.5 m —— 足以把点推到相邻格。
    # 现在按**深度时刻与标签时刻的机体位移**平移补偿（同一台相机、≤0.15 s，
    # 两帧只差一个平移）；深度时刻查不到 odom 时不补偿并计数（不拿猜的位置平移）。
    # 实测补偿量见 `帧统计` 日志的「补偿位移」字段。
    # ---- 严格时间同步（2026-11-09）----
    # odom 按**标签时间戳**查询/插值（不再拿"最新一条"）：图像 10 Hz、odom 30 Hz，
    # 拿最新 odom 服务一张落后 100–200 ms 的标签帧会偏 0.2–0.4 m（接近一个地图格）。
    odom_pair_tolerance_s: 0.15
    odom_buffer_n: 120
    # 深度按标签时间戳从环形缓冲里选**最近**一帧，而不是用"最新一张"。
    depth_buffer_n: 8
    # 四元数范数容差：偏离单位四元数超过此值即判姿态非法、丢帧
    # （投影公式默认单位四元数，范数错会让整帧点系统性偏移）。
    quat_norm_tolerance: 0.01
    # 深度空间一致性门限（m）：与右/下邻像素的轴向深度跳变超过它即判边缘、不进点池。
    # 深度边缘是"墙深被套到地面像素"的主要来源，其投影点会外扩很远。0 = 关闭。
    depth_edge_m: 0.5
    # ---- 碎片合并（2026-11-09）----
    # 大建筑被深度噪声/遮挡/画幅边缘切成多块时，每块单独可能低于面积门限而被丢弃，
    # 覆盖率因此有与算法无关的天花板。空间邻近 + 高度一致的碎片并入达标母体后再判门限。
    # gap=0 即关闭（与改造前逐字节等价）。1.5 m ≈ 3 格：跨得过 1–2 格断口，
    # 又不会把相邻两个独立障碍并成一个。
    fragment_merge_gap_m: 1.5
    fragment_merge_dz_m: 1.0
