# agc_ground 参数——由 ground_bringup.launch.py 单一注入，节点不得覆写（ADR-0020 的 #params）
#
# 安全层：**自研** ground_safety_filter（ADR-0045）；不再引用 Nav2 安全层运行时。
# 链路：RL/占位策略 → /agc/ground/cmd_vel_raw → ground_safety_filter → /agc/ground/cmd_vel
# → ground_drive_relay（唯一执行口中继）→ GZ。链路**顺序**不变（ADR-0004 仍有效部分）。
#
# 路径输入（2026-11-01，ADR-0013）——**参数边界**：
# * 本文件**已新增** `hybrid_astar_se2_planner` 段（节点本地 config）；
# * **未新增契约全局入口**：`#params` 清单无新条目，这些键由既有 launch 透传。
# * “没改契约文件”不等于“没有新增入口”——两者须分开表述。
# `/agc/ground/path`（`nav_msgs/Path`，`frame_id=world`）是局部策略的**输入数据**，不是命令；
# 它**不进** `command_source` 互斥域，也不改变唯一执行口。质量门（从未收到/空/单点/帧不一致/过期）
# 与失效零速由消费侧执行（ADR-0013）。
#
# **启动边界（ADR-0045）**：这一条与改造前**相反**，必须按新口径理解。
# 旧 Nav2 安全层的 `process` 只由 `cmd_vel_in` 回调触发、节点无定时器，因此命令源完全缺失时
# 它**一个速度消息都不发**。自研安全层用定时器**每拍无条件发布**（默认 20 Hz），
# 没有任何输入时发零速（状态 STARTUP / NO_COMMAND / MAP_MISSING …）。
# ⇒ 「启动期零命令」从此是**有界且可观测**的：`/agc/ground/cmd_vel` 的发布计数/周期必须连续，
# 断流即为缺陷。仍需分别验证 ①启动无命令 ②运行中各类失源 ③地图失效。
#
# 三档阈值（ADR-0010）：顺序不变量 紧急 < 碰撞 < 安全；
# 绝对值为可标定值，标定口径 = Nav2 时间窗法（v_max 与 a 由 补丁实测）。
# 标定值（ADR-0010 实测回填，2026-10-13）：紧急 1.0 m < 碰撞 2.0 m < 安全 4.0 m。
# * 安全档 = slowdown（4.0 m 区，降速至 30%）
# * 碰撞档 = stop（2.0 m 区停车）
# * 紧急档 = stop（1.0 m 区立即停车，最后防线）
# * approach 档 = Nav2 时间窗（time_before_collision），体现"按速度留时间"口径
#
# ——扫掠几何推导（2026-10-15，评审风险）——
# 车体（Husky A200 保形换装，agc_car.sdf.xacro）：碰撞盒 1.0074 × 0.5709 × 0.2675，
# 半长 a = 0.5037 m、半宽 b = 0.28545 m、半对角 r_fp = sqrt(a² + b²) = 0.5789 m；
# 车最大线速 v_max = 1.5 m/s、制动 a ≈ 0.9 m/s²、ω_max = 2.0 rad/s（ADR-0010 实测）。
# 三档扫掠区改用 **Nav2 `velocity_polygon`** 承载（覆盖原地旋转 + 侧/后向运动，非仅前向矩形），
# 每档 4 个子区 rotation / translation_forward / translation_backward / stopped：
# * 前向矩形自 x=x0=0.55 m 到 +tier；后向矩形镜像自 -tier 到 -x0（tier = 4.0 / 2.0 / 1.0）。
# x0=0.55（越过车头）与旧值一致；自体过滤（scan_self_filter）已滤除车体返回，故后向 / 旋转
# 方向亦无自身误触发。
# * 旋转子区取 **方框**、半边长 = R_tier（方框内切圆半径 R_tier 覆盖半径 R_tier 的盘）：
# R_tier 与 tier 逐档一致，三档**顺序**（紧急 < 碰撞 < 安全）是不变量。
# 车角扫掠半径 r_fp=0.5789 ≤ R_emergency 1.0，故旋转一档必覆盖整车角扫掠。
# * stopped 兜底子区（**最后检查**，须覆盖全速度域）：小车体方框、半边长 = r_fp + 0.15 ≈ 0.73，
# 速度域 linear -1.5..1.5 / theta -2.0..2.0（ω_max=2.0）。
# 子区按 cmd_vel 的 linear.x / angular.z 命中区间选择；holonomic: false（差速车 = 非完整）。
# tier 与 ADR-0010 时间窗口径一致（v_max 与 a 推导出的停车距离）。
# 自体过滤（scan_self_filter）：激光（360 束/360°，1 束/度；range [0.2, 20]，z=0.48 车顶水平面）
# 会返回车体自身（如车头/外伸）；逐束把落在车体矩形（|x| ≤ a+margin，|y| ≤ b+margin）内的返回置
# +inf。参数 footprint_half_length_m 0.5037 / footprint_half_width_m 0.28545 /
# self_filter_margin_m 0.10（实测自返回极值后微调，见 w5 tasks 修订）。
# ——安全层与 costmap 消费自滤后的 **/agc/ground/scan_filtered**。
# min_points 标定（360 束/360°：半径 D 处相邻束间距 ≈ 0.01745·D）：
# 障碍张角对应束数 ≈ 宽 /(0.01745·D)。薄障碍（细柱/薄板）在停车区边缘命中束数很少
# （见 w5 tasks 修订实测），故三档 min_points 下调为 **2**（能把薄障碍检出的最小值）。
#
# ——传感器高度与障碍族限制**如实登记** + 安全声明**收窄**（2026-10-17，评审风险）——
# 安装高度：`car/lidar_link` **z = 0.48 m**（车顶水平面，agc_car.sdf.xacro）。
# 本安全层 / costmap 消费的 `/agc/ground/scan_filtered` 为 **z≈0.48 的 2D 水平面扫描**
# （`scan` 源无高度带；对齐 Nav2 collision_monitor：`scan` 源只覆盖扫描平面那一层，
# `pointcloud` 源才有 min_height/max_height 高度带）→ **可见性 = 单一 z=0.48 平面**。
# 障碍族可见性边界（**如实**，**不得外推**）：
# ① 低障碍（顶面低于扫描面 / 不入水平光束）→ **不可见**；
# ② 悬空结构（z=0.48 之上、非扫掠高度）→ **不可见**；
# ③ 薄障碍（细柱/薄板）→ 受**束间距**限制（距离 D 处相邻束间距 ≈ 0.01745·D m；三档 min_points=2）；
# ④ 自体遮挡 / 自滤（scan_self_filter）后仅未被车体遮挡方向可见。
# **收窄声明**：把「立柱 world 达标」**限定**为「在 z≈0.48 处有足够水平截面且进入光束」的障碍族；
# **明确不得外推**为任意障碍（含低/悬空/薄障碍）的通用安全保证。口径详见 ADR-0009。
#
# 载荷外伸 / 碰撞口径一致化：捕获网面 @ z=1.60、干扰载荷 @ z=0.30、**均无 collision**
# → **不**进本安全层视野、**不**参与真实物理接触（物理接触验证 unsupported）；外伸 1.0 m 仅作
# **出生净空推导**登记（ADR-0012）；载荷**物理启用后必须重标** / 与本口径。详见 ADR-0009。
#
# ——失源停车窗口标定（2026-10-15，评审风险）——
# source_timeout **不再沿用** Nav2 官方示例（5.0 s，未经本车标定）——原值失源盲行可达 1.5×5.0=7.5 m，
# 与 4 m 安全档严重不匹配。改由**本车实测**动力学与链路推导（详见 collision_monitor 段内注释）；
# 失源后总停距 < 碰撞档 2.0 m，窗口 T 与 `agc_perception/config/perception.yaml` 的
# `source_timeout_s: 0.3` **同口径**（标定依据落 ADR-0021）。

# ——地面安全层（自研，ADR-0045）——
# 唯一障碍输入 = 任务1 的规划层地图 `/agc/map`（**不**订阅 scan / 点云 / costmap）：
# 障碍表示与规划同源，因此不存在"规划看到 A、安全层看到 B"的第二份障碍表示。
#
# 判据（**不是**"区域里有几个点"，而是"能不能在进入之前停住"）：
#   s_brake = |v|·t_react + v²/(2a)；footprint 沿制动轨迹扫掠到 s_brake 终点，
#   扫掠区内只允许**已知自由**；出现阻挡或未知 ⇒ 停不住 ⇒ 不得放行。
# 这样既 fail-closed，又不会因为地图只覆盖作业区一部分就把车永久钉死。
#
# 三档距离沿用 ADR-0010 的**顺序不变量**（紧急 < 碰撞 < 安全）与已回填实测值 1.0 / 2.0 / 4.0 m。
# 恢复门槛 `d_recover_pass` **必须严格高于** `d_safety`，否则会在门槛上抖动（启动期校验会拒绝）。
#
# 输入超时按**各自发布周期**推导，不得沿用扫描口径 0.3 s：
#   命令 20 Hz → 0.5 s（≈10 拍）；车体 30 Hz → 0.5 s；地图 **2 Hz** → 2.0 s（≈4 拍）；任务 1 Hz → 3.0 s。
ground_safety_filter:
  ros__parameters:
    cmd_in_topic: "/agc/ground/cmd_vel_raw"
    cmd_out_topic: "/agc/ground/cmd_vel"
    map_topic: "/agc/map"
    map_valid_topic: "/agc/map/valid"
    odom_topic: "/agc/ground/odom"
    odom_valid_topic: "/agc/ground/odom_valid"
    state_topic: "/agc/task/state"
    status_topic: "/agc/ground/safety_status"
    expected_cmd_frame: "car/base_link"
    expected_map_frame: "world"
    rate_hz: 20.0
    # 单拍预算（ms）：超限记 BUDGET_EXCEEDED 并零速（显式状态，不静默变慢）。
    budget_ms: 20.0
    # ——三档距离（ADR-0010 实测回填：紧急 1.0 < 碰撞 2.0 < 安全 4.0 m）——
    d_emergency: 1.0
    d_collision: 2.0
    d_safety: 4.0
    # ——恢复迟滞（门槛严格高于进入门槛）——
    d_recover_slow: 2.0
    d_recover_pass: 4.5
    recover_ticks: 3
    # ——输入超时（按各自发布周期，见文件头）——
    t_cmd_timeout: 0.5
    t_body_timeout: 0.5
    t_map_timeout: 2.0
    t_permit_timeout: 3.0
    # ——速度上限（与 src/agc_sim/config/car.yaml 共享同一事实）——
    v_cap: 1.5
    w_cap: 2.0
    # ——车体 footprint（碰撞盒 1.0074 × 0.5709，与 scan_self_filter 同源）——
    footprint_half_length: 0.5037
    footprint_half_width: 0.28545
    # ——制动模型（**实测标定**，2026-11-13，safety_dynamics_v1）——
    # 实测（`--stage brake`，v_max=1.5 阶跃到 0）：a = 3.6079 / 3.2754 m/s²。
    # 取**最小值** 3.2754 而不是中位：a 越小 ⇒ s_brake 越大 ⇒ 停得越早（安全方向）。
    # 原值 0.9 来自旧标定（ADR-0010），实测是其 3.6 倍 —— 旧值会让车远远提前停车。
    a_brake: 3.2754
    # 实测（`--stage reaction`）：安全层输出零速 → 真值开始减速 = 0.1841 s (p95)。
    # **不含** t_cmd_timeout（那是"输入失效检测"窗口，已在 t_cmd_timeout 里单独计）。
    # 原值 0.3 偏大（保守方向，但会让停车距离虚高）。
    t_react: 0.1841
    # ——离散误差（实测 + 推导）——
    # 实测（`--stage cell`）：同一条逼近路线三次的判停净空为 2.249 / 2.086 / 1.773 m，
    # 跨距 0.476 m ≈ **1 个 0.5 m 格** —— 正是"格中心量化"的表现。
    # 故取**半格对角** 0.3536 m（而不是 0.05）：0.05 只有 1/10 格，量化误差被低估，
    # 会让净空判据系统性乐观（不安全方向）。
    cell_epsilon: 0.3536
    # ——判据阈值——
    # **逃逸能力下限**（不是手感值）。改造前取 0.2，实测证明那是错的：
    #   ratio=0.20 → 2 s 横移 0.0002 / 0.030 / 0.048 m（车基本不动）
    #   ratio=1.00 → 0.956 / 1.153 / 0.769 m
    # 即裁到 20% 等于取消横向逃逸能力。下限由 `slowRatioFloor()` 从
    # `lateral_reach_required_m / lateral_window_s / lateral_eff_ratio` 反解，
    # 启动期若低于下限会**拒绝启动**。
    slow_min_ratio: 1.0
    # ——逃逸能力标定参数（用于反解 slow_min_ratio 下限）——
    # `lateral_reach_required_m` **必须与 `agc_rl/config/rl.yaml` 的 `control.max_offset`
    # 同值**：两处不同就是"策略以为能做 A、安全层按 B 校验"的两套能力口径。
    # 2026-11-13 用户裁定（ADR-0046）：1.0 → **0.65 m**（实测最小 0.6888 m 之下留余量）。
    # 反应窗口 T = 2.0 s **保持不变**（不为迁就单一能力主张而放宽反应窗口）。
    # 实测折扣（同平台同摩擦，`--stage slow` 的 PASS 态对照臂）：
    #   0.956 / 1.153 / 0.769 m，逐轮理想圆弧 1.398 m（按该轮实际 v=1.0, ω=0.96 算）
    #   ⇒ 折扣 0.68 / 0.82 / 0.55，取**最小值** 0.55（安全方向）。
    # 收窄 required 到 0.75 之后 `slowRatioFloor()` 反解出 **1.0**（SLOW 不降速）——
    # 这是诚实结论：本车的能力**贴着**要求，任何降速都会让"能躲开"退化成"躲不开"。
    lateral_reach_required_m: 0.65
    lateral_window_s: 2.0
    lateral_eff_ratio: 0.55
    # 制动扫掠区内未知占比上限：超过即"证据不足"，不得放行。
    unknown_ratio_limit: 0.5
    sweep_cell_limit: 40000
    sweep_pose_samples: 24
    # ——任务许可：只有这些 AgcTaskState::state 允许驱动车体——
    # 3 = GROUND_APPROACH、4 = TRACKING_SUCCESS（与消息定义同值的本地常量）。
    permit_require: true
    permit_states: [3, 4]

# 地面全局路径规划器（Hybrid A* on SE(2)，ADR-0048）。
# **只发路径，不发速度**：因此不是第二命令者，也不进 `command_source` 互斥域。
# **不是** Navfn / planner_server / costmap：不链接 nav2_*、不订阅 scan/点云。
# 唯一障碍输入是 `/agc/map`（与安全层同源，ADR-0045）。
#
# 名字带方法：用户裁定「这不会是唯一一种规划算法」，不能占住「地面主方案」的位置。
#
# 栅格语义按 ADR-0041 风险分档（0 通行 / 1–98 有代价通行 / 99 车心擦碰 / 100 占据 /
# 负值未知）。**不**用 `planning_policy.hpp` 的 `classifyCell`（它把 1–99 全当未知，
# 实测在 dense_map 上无解）。
hybrid_astar_se2_planner:
  ros__parameters:
    map_topic: "/agc/map"
    map_valid_topic: "/agc/map/valid"
    odom_topic: "/agc/ground/odom"
    odom_valid_topic: "/agc/ground/odom_valid"
    goal_topic: "/agc/ground/goal"
    goal_info_topic: "/agc/ground/goal_info"
    state_topic: "/agc/task/state"
    path_topic: "/agc/ground/path"
    status_topic: "/agc/ground/planner_status"
    world_frame: "world"
    rate_hz: 5.0
    # 输入时效：地图 2 Hz -> 2.0 s（≈4 拍）；odom 30 Hz -> 0.5 s；goal 1 Hz -> 2.0 s。
    map_timeout_s: 2.0
    odom_timeout_s: 0.5
    goal_timeout_s: 2.0
    require_task_auth: true
    # 重规划判据（ADR-0013 (a) 的顺序：目标变 -> 地图变 -> 超时 -> 周期）
    replan_period_s: 2.0
    replan_displacement_m: 1.0
    max_path_age_s: 5.0
    # 双判据的第二个：已知自由格数变化超过它才触发重规划。
    # 实测探索步进的自由格增量是 +1433..+2403，而 publish_deadband=5 的噪声只动几十格。
    signature_free_delta_cells: 200
    goal_reached_tol_m: 0.3
    # ---- 车体（与安全层 footprint 同源；与 agc_sim 的碰撞盒一致）----
    footprint_half_length: 0.5037
    footprint_half_width: 0.28545
    # footprint 的**全向**外扩 = 半格对角（量化）+ 定位/跟踪误差。
    # **不是** d_collision=2.0 —— 那会造出全向 2 m 禁行区（ADR-0047 的教训）。
    footprint_margin: 0.3536
    # ---- 运动基元（第一版不倒车；允许原地旋转）----
    primitive_dt: 0.333
    primitive_max_step_m: 0.15
    # ---- 搜索 ----
    yaw_bins: 16
    search_time_budget_s: 3.0
    max_expanded_nodes: 60000
    goal_position_tolerance_m: 0.4
    heuristic_weight: 1.0
    clearance_target_m: 1.2
    # ---- 走廊判据（**质量偏好**，不是安全证明）----
    # 走廊 = 沿运动方向、车体宽度带内的纵向间隙；阻挡档**只含真实障碍（100）**。
    # 把 99 也算进走廊会让 dense_map 上走廊阈值 >=1.5 m 时无解（实测）。
    corridor_enabled: true
    corridor_clearance_m: 2.0
    corridor_max_scan_m: 6.0
    # ---- 优化（弹性带；**不是安全证明**）----
    optimization_enabled: true
    resample_spacing_m: 0.25
    optimization_max_iterations: 200
    optimization_time_budget_s: 0.5
    kappa_max: 1.0
    # ---- 动力学（与 ground.yaml 安全层同源：v_cap/w_cap 与 car.yaml 一致）----
    v_cap: 1.5
    w_cap: 2.0
    a_lat_max: 1.0
    a_acc_max: 0.8
    a_brake_max: 1.0
    w_acc_max: 2.0
    # ---- 兜底（有界直连：搜索到已知区前沿后直连 goal，末端恒为 goal）----
    direct_link_enabled: true

scan_self_filter:
  ros__parameters:
    in_topic: "/agc/ground/scan"
    out_topic: "/agc/ground/scan_filtered"
    footprint_half_length_m: 0.5037
    footprint_half_width_m: 0.28545
    self_filter_margin_m: 0.10

# ——执行中继硬化（2026-10-15，评审风险）——
# 背景：GZ DiffDrive 插件**没有**命令超时（本机 libgz-sim8-diff-drive-system.so 参数清单仅
# max_linear_velocity / max_angular_velocity / odom_topic 等，无 timeout/deadman），
# 故中继自身死亡或时钟异常时末端可能持续执行最后命令。本段只做**中继自身**的鲁棒化：
# * 单调钟判接收年龄（watchdog_s）——与 ROS 时钟解耦，冻结 / 回拨也发零；
# * Header 校验：expected_frame_id（错帧拒收）+ 采样年龄 max_sample_age_s（防陈旧采样）
# + stamp 倒退容差 frame_id_tolerance（防时钟冻结 / 回拨时的旧命令重放）；
# * 有限性校验（linear/angular 任一分量 NaN/±inf → 拒收）；
# * 按模型上限限幅：max_linear_velocity / max_angular_velocity 与
# src/agc_sim/config/car.yaml 的 model 参数一致（**共享事实**，非复述约束）。
# 末端（GZ DiffDrive）失效停车机制**不在本节点**，由后续子任务实现。
# 取值：watchdog_s 0.3（与 source_timeout 同量级）；max_sample_age_s 0.5（> watchdog，
# 留链路时延余量）；frame_id_tolerance 0.05（容忍抖动 / 重排序，不宽容明显倒退）。
ground_drive_relay:
  ros__parameters:
    in_topic: "/agc/ground/cmd_vel"
    out_topic: "/model/agc_car/cmd_vel"
    watchdog_s: 0.3
    expected_frame_id: "car/base_link"
    max_sample_age_s: 0.5
    frame_id_tolerance: 0.05
    max_linear_velocity: 1.5
    max_angular_velocity: 2.0

# 注：命令源自 `agc_rl` 的 ground_policy_rl 提供，其参数在 `agc_rl/config/rl.yaml`；
# 离线对照基线自 `ground_baseline` 提供，其参数在 `config/baseline.yaml`。
# 二者**互斥**由 ground_bringup 的 `command_source` 单一选择（同一时刻仅一路下发）。
