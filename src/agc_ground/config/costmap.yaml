# agc_ground 分层 costmap 参数——由 ground_bringup.launch.py 单一注入
#
# 用途：**离线对照基线**（R8 的 Nav2 planner/controller）**自持**
# （`ground_baseline` 内建 `Costmap2DROS`，节点名 `costmap`）；
# RL 主控**不消费** costmap（[ADR-0003](../../../docs/adr/0003-nav2-paradigm-absorption.md#top)），
# 故 `command_source=rl` **不**起独立 costmap 进程；
# **不作** collision_monitor 的感知源（安全层走 `scan`，见 ground.yaml）。
#
# 分层语义（承接 遗留；分层语义映射表见 spec「Nav2 吸收点」）：
# static ← `/agc/map`（OccupancyGrid，latched）
# obstacle← `/agc/ground/scan_filtered`（2D LaserScan，车顶水平扫描， 自滤后）
# voxel ← `/agc/sim/car_points`（3D PointCloud2）
# inflation ← 本层本地膨胀（无外部输入）
# 坐标：`global_frame=world`、`robot_base_frame=car/base_link`（ADR-0020 的 #namespace）；
# **全域（非滚动）**：`static` 层接入 `/agc/map` 后，Nav2 static 层把栅格重设为
# 地图全域（160×160 @ 0.5，origin −40,−40），故 costmap 覆盖整个作业区。
# 初值的 rolling/width/height 在 static 层生效前使用，之后由 static 层接管。

costmap:
  ros__parameters:
    update_frequency: 5.0
    publish_frequency: 2.0
    global_frame: world
    robot_base_frame: car/base_link
    rolling_window: false
    width: 40
    height: 40
    resolution: 0.25
    robot_radius: 0.6
    # 未知格在 costmap 里保留为 NO_INFORMATION（255），**不**折叠成 free。
    # 注意（2026-11-08 Q9）：`track_unknown_space: true` **单独不足以**表达
    # "未知区不可走" —— Navfn 的 `allow_unknown` 默认是 true，两者互相抵消，
    # 实际是"未知区随便穿"。真正的判据在 `planning_policy.hpp` 的端点检查里，
    # 不依赖 Navfn 私有参数（项目正与 Nav2 解绑）。
    track_unknown_space: true
    plugins: ["static_layer", "obstacle_layer", "voxel_layer", "inflation_layer"]
    # ——static 层： 的 /agc/map——
    static_layer:
      plugin: "nav2_costmap_2d::StaticLayer"
      map_subscribe_transient_local: True
      map_topic: "/agc/map"
      # **必须关掉 trinary（ADR-0041）**：`/agc/map` 自 ADR-0041 起输出**风险分档**，
      # `1–98` 表示"有代价但可通行"（几何占据 + 米制膨胀的共同结果）。
      #
      # Nav2 `StaticLayer::interpretValue` 在 `trinary_costmap: true`（默认）下把
      # `1–99` 一律折成 `FREE_SPACE` —— 于是我们精心算出来的"贴车半径有代价"
      # 会被读成"完全可通行"，安全膨胀**静默失效**。
      # 关掉它才走 `scale = value / lethal_threshold` 的比例代价分支（1→2、50→127、98→249）。
      #
      # `lethal_threshold` 保持 100：只有 `100` 才是致命占据（与 `planning_policy.hpp`
      # 的 `classifyCell` 同口径：`>= 100` 才算 occupied）。
      trinary_costmap: false
      lethal_cost_threshold: 100
    # ——obstacle 层：2D 激光——
    obstacle_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"
      enabled: True
      observation_sources: scan
      scan:
        # 消费 scan_self_filter 自滤后的扫描（与安全层同一口径）
        topic: /agc/ground/scan_filtered
        max_obstacle_height: 2.5
        clearing: True
        marking: True
        data_type: "LaserScan"
        raytrace_max_range: 20.0
        raytrace_min_range: 0.0
        obstacle_max_range: 15.0
        obstacle_min_range: 0.0
    # ——voxel 层：3D 点云——
    voxel_layer:
      plugin: "nav2_costmap_2d::VoxelLayer"
      enabled: True
      publish_voxel_map: True
      origin_z: 0.0
      z_resolution: 0.25
      z_voxels: 16
      max_obstacle_height: 2.5
      # 地面回波（z≈0）不得计为障碍，否则整片地面被判 lethal、Navfn 无法规划
      min_obstacle_height: 0.30
      mark_threshold: 0
      observation_sources: pointcloud
      pointcloud:
        topic: /agc/sim/car_points
        data_type: "PointCloud2"
        max_obstacle_height: 2.5
        min_obstacle_height: 0.30
        clearing: True
        marking: True
        raytrace_max_range: 20.0
        raytrace_min_range: 0.0
        obstacle_max_range: 15.0
        obstacle_min_range: 0.0
    # ——inflation 层（本地）——
    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      cost_scaling_factor: 3.0
      inflation_radius: 1.0
    always_send_full_costmap: True