# 出生布局**单一真源**（F1 · 2026-10-31）
#
# 目的：让「世界 spawn」「复位位置（/agc/scenario/reset）」「己方机起飞参考（PX4_GZ_MODEL_POSE /
# origin_pose）」三处**取同一组坐标**，而不是各写一份。本文件是这三处的**唯一**来源：
#   * `w6.launch.py` 读本文件 → 把车 / 目标 spawn 以 launch 参数**显式**传给 `world_bringup`
#     （世界 spawn 与复位同值 → 复位时不会把实体"挪位"）；
#   * 同一合并结果（base + 场景覆盖）落 `scenario_reset` 参数，故「复位位置 == 世界 spawn」；
#   * 己方机默认起飞位由本文件派生（`px4_own_pose` 留空时），并由 launch 单值同时喂给
#     `PX4_GZ_MODEL_POSE` 与空中节点 `origin_pose`（局部系原点）——同一字符串，不可能漂移。
#
# ---- 布局意图（来源：用户 2026-10-31「双方放在相对两条短边附近，己方车机初始位置相近」）----
# 中央空旷区是 `agc_world.sdf` 的 `apron_center`（混凝土作业坪）：**40 × 20 m，中心 (0,0)**，
# 即 x ∈ [−20, 20]、y ∈ [−10, 10]；两条**短边** = x = −20（西）/ x = +20（东）。
# 实测净空边界（yard 真源逐图元水平足迹，复合体按锚点 yaw 旋转，含 0.5 m 余量）：
#   x ∈ [−20.00, +20.00]、y ∈ [−10.00, +8.75] → 作业坪北侧被 `sign_a`(−11, 9.5) 与
#   `tower_n`(−6, 11.5) 的**图元**侵入约 1.25 m，故**实际**可用矩形是 40 × 18.75 m
#   （不是名义 40 × 20）。两侧短边本身无侵入 → 车 / 目标各贴一侧短边内 5 m。
#
# ---- 三组距离（设计目标见派工单：车/目标 ≥30 m、己方机/目标 ≥25 m、己方车机 3–8 m）----
#   | 组 | 设计值 | 判据 |
#   |---|---|---|
#   | 车 ↔ 目标 | **30.15 m** | ≥ 30 m |
#   | 己方机 ↔ 目标 | **26.17 m** | ≥ 25 m |
#   | 车 ↔ 己方机 | **4.00 m** | 3–8 m |
#   C7（车↔目标出生净空下限 6.0 m，ADR-0012）**只增不减**：由旧 11.85 m 提升到 30.15 m。
#
# ---- 与旧布局的净空对比（仓库核查口径 (g)：`_obb_clearance − footprint_radius`，三图取最小）----
#   旧：car(−4,−3) / target(6.5, 2.5) / own(0, 0)  → yard 8.67 / 6.48 / 9.07 m（min 6.48）
#   新：car(−15, 1) / target(15, −2) / own(−11, 1) → yard 3.74 / 3.19 / 7.16 m（min 3.19）
#   注意：本口径的 `footprint_radius` 取**实体水平外接圆**（分段长墙 ≈ 半长 15 m），故对
#   yard 两侧 30–34 m 分段围墙极为保守；**真实几何净空**（点到图元表面的距离）同点位为
#   car 8.85 / target 10.36 / own 8.34 m，且仍 > 0（核查 (g) 的 `all_spawns_clear` 只要求 > 0）。
#   若后续要恢复更高裕度，应改的是**分段围墙的 footprint 口径**（属 ADR-0009 安全层模型），
#   不是把出生点挪回中央——那会同时破坏"贴两侧短边"的布局意图。
#
# ---- 三个地图的一致性（坐标不随地图变，保证 s04/对照场景可直接比较）----
#   三图同坐标的核查最小裕度（口径 (g)）：yard 3.19 / minimal 11.62 / open_field 8.65 m；
#   安全层待机环带（目标周围 10.2 m）在三图均存在 ≥90° 连续可行弧（yard 190° / minimal 310° /
#   open_field 216°），且**西侧（己方机来向）恒为可行**。
#
# ---- 口径说明（不制造第二真源）----
#   * z 分两种口径：世界 spawn 的车 z = **轮触地**（car.yaml 0.143），复位车 z = 0.010
#     （`scenario_reset` 既有口径）；两者都写在下面，消费者各取所需，不再各自硬编码 x/y。
#   * 目标 z（世界 spawn / 复位）同取 **0.12**（2026-11-05 由 2.0 下调，理由见下方 target 段）。
#     **H0（2026-11-02）语义澄清**：该值是**世界放置值**，只在 PX4 attach 之前是有效世界高度；
#     目标由第二个 PX4 实例接管后立即被其位置环拉回原点附近（实测 attach 后 `gt_z≈−0.015 m`，
#     见 `experiments/h0-altitude-semantics/` 的 round-3 探针 CSV），随后由
#     `intruder_driver.cruise_alt_m`（相对 episode 原点）决定巡航高度。
#     ⇒ **它不是出生高度、不是巡航高度、也不与 `cruise_alt_m` 叠加**；三者语义不同，不得合并。
#     **2026-11-05 补记**：原值 2.0 造成"spawn 后 0.64 s 自由落体砸地并穿地 1.8 cm、
#     在地面躺约 20 s 后被 PX4 拉到巡航高度"的可观测缺陷（用户报告"目标起飞前突然掉下来"）。
#     下调到 0.12 使"落地"这一步几乎瞬时且不可见；PX4 attach 后的位置环行为**完全不变**。
#   * `agc_sim/config/car.yaml` / `target.yaml` 的 `spawn` 仍是**模型参数 + 独立使用
#     `world_bringup`（不经 w6 入口）时**的缺省值；w6 入口一律以本文件为准（`spawn_args`
#     显式传参覆盖 launch 缺省，契约 [参数入口]）。本单白名单不含 `agc_sim/config/`，
#     故**有意不改**它们——它们不是本布局的第二份真源，只是 standalone 缺省。
spawn_layout:
  car:
    x: -15.0
    y: 1.0
    yaw: 0.0
    world_z: 0.143
    reset_z: 0.010
  target:
    x: 15.0
    y: -2.0
    yaw: 0.0
    # 2026-11-05（用户裁定）：世界放置 z 2.0 → **0.12**（机体静止贴地）。
    # 为什么必须改：目标由 `world_bringup` 在 t≈3~15 s spawn，而第二个 PX4 实例
    # （`intruder_px4_delay_s` 默认 35 s）才 attach 上去。这中间**没有任何电机控制**，
    # 而 x500 的 `base_link` 是 `<gravity>true</gravity>` → 从 2.0 m 自由落体，
    # **0.64 s 就砸到地面**（实测采样 z: 2.0 → −0.018，触地且穿地约 1.8 cm），
    # 随后在地面躺约 20 s，再被 PX4 位置环一把拉到 `cruise_alt_m` 巡航高度。
    # 用户观感即"目标起飞前不久突然从天上掉下来"——实为一直在下坠、贴地、穿地。
    # 改到 0.12 后：落体距离仅 0.12 m（0.16 s），肉眼不可见，语义变成
    # "停在地面的无人机 → 起飞"，符合物理直觉且不再穿地。
    # 取 0.12 的依据：x500 起落架/机体底面相对 base_link 约 −0.05 m、机体高 0.10 m；
    # 0.12 使底面约在 +0.07 m，略高于地面，避免 spawn 瞬间与地面重叠触发接触事件。
    # **不动 PX4 时序**（`own_px4_delay_s` 25 / `intruder_px4_delay_s` 35 保持原值）：
    # 那两组延时是 ADR-0027 为规避 uXRCE participant 创建超时（`participant: 255`）而定，
    # 缩短会重新引入更难查的 DDS 启动风暴故障。
    # **净空判据不受影响**：`scenario_reset` 的出生净空校验全部用水平距离
    # `std::hypot(x, y)`（见其 `car_target_clearance` / `target_obstacle_clearance` 等），
    # 与 z 无关。
    # **也不与 `cruise_alt_m` 叠加**：后者是相对 episode 原点的巡航上升量
    # （`w6_base.yaml` intruder_driver 段，H0 2026-11-02 语义澄清），二者语义不同。
    z: 0.12
  own_uav:
    x: -11.0
    y: 1.0
    z: 0.2
    yaw: 0.0
  # ---- 固定任务目标的**派生偏移**（F1 round-2，2026-10-31）----
  # 问题（round-1 审查第 6 条）：`task_manager.goal_x/goal_y` 是**第二处**关联坐标。改了 target
  # 出生位却忘了改 goal，C8 的「车↔目标 ≤ d_track=3.0 m」就永远不成立 → 跟踪终态不可达。
  # 规则：**默认场景**（场景未显式给 goal 且 `goal_follow_target: false`）的任务目标 =
  #       `target 出生位 + (goal_dx_m, goal_dy_m)`。
  # 取 (−2.5, 0)：落在目标以西 2.5 m（沿用旧布局 goal↔target 2.55 m 的同类关系），且仍在中央
  # 作业坪内（x∈[−20,20]、y∈[−10,10]）。改 target 时 goal 自动跟随，不再需要手工同步。
  # 场景**显式**给 goal 的（s08/s11/s12–s16 等）一律以场景值为准——那是场景语义，不是布局缺省。
  goal_offset_m:
    dx: -2.5
    dy: 0.0
  # ---- 候选出生位置评估（round-1 审查第 3 条：不预设"只能改模型"）----
  # yard 的核查 (g) 最小裕度 3.19 m 来自**分段围墙的外接圆口径**（30–34 m 段 ≈ 半长 15 m），
  # 不是出生点贴得太近。若未来需要更大裕度，可评估的候选方向（按代价从低到高）：
  #   ① 把车/目标沿 x 各向内收 2–4 m（仍在两短边附近，代价：车↔目标距离跌破 30 m 下限）；
  #   ② 把目标移到 y=+4..+6 一带（远离南侧围墙段，代价：环带可行弧缩短）；
  #   ③ 评估**分段围墙的 footprint 口径**（ADR-0009 安全层模型，需另立任务与裁定）。
  # 本单不预设①②③ 的结论，也不以削弱安全层判据来换裕度。

