# 出生布局：世界 spawn / 复位位置 / 己方机起飞参考三处共用同一组坐标（ADR-0007 / ADR-0012）。
# main.launch.py 读本文件后显式传给 world_bringup 与 scenario_reset；己方机位由 own_uav 派生。
# 布局意图与净空推导见 ADR-0012 实施回填；改坐标须同步 tests/check_scene_geometry.py。
#
# ---- `per_map`（2026-11-10，ADR-0036）：出生位也是**地图属性** ----
# 与 `flight_altitude` 同款论证：某张图上"车从哪出发"是**地图事实**，不是全局常量。
# 缺省（不写 `per_map` 或该图不在表内）→ 用下方顶层坐标（`minimal` / `yard` / `open_field`
# 三图**逐值不变**，历史证据基线不受影响）。
# 解析口径（单一实现：`agc_task/launch/scene_spawn.py` 的 `load_spawn_layout`）：
#   顶层 `car/target/own_uav` 提供**完整缺省**；`per_map.<map>` 只写**要覆盖的键**（深合并一层）。
# 未登记的地图名 → 拒绝运行（不静默回落，避免"换图不换出生位"静默漂移）。
spawn_layout:
  car:
    x: -15.0
    y: 1.0
    yaw: 0.0
    world_z: 0.143
    reset_z: 0.010
  target:
    x: 15.0
    y: -2.0
    yaw: 0.0
    # 世界放置高度，仅 PX4 attach 前有效；不是巡航高度（ADR-0012 实施回填）。
    z: 0.12
  own_uav:
    x: -11.0
    y: 1.0
    # 世界放置高度，仅 PX4 attach 前有效；不是巡航高度（ADR-0012 实施回填）。
    z: 0.2
    yaw: 0.0
  # 默认场景任务目标偏移（ADR-0012）；场景显式给 goal 时以场景值为准。
  goal_offset_m:
    dx: -2.5
    dy: 0.0

  # ---- 按地图覆盖（ADR-0036）----
  # `dense_map`：目标在作业区正中 (0,0)，车与己方机在西边缘。
  # 车↔目标 40.45 m（≥30）、己方机↔目标 34.06 m（≥25）、车↔机 7.21 m（∈[3,8]）——
  # 三条设计目标（`spawn_design_goals_met`）全部满足，判据未放宽。
  # `goal_offset_m` 沿用顶层缺省 ⇒ 派生任务目标 = (−2.5, 0)，距目标 2.50 m ≤ d_track 3.0。
  #
  # —— 车出生位 2026-11-13 从 (−34,−6) 改为 (−40,−6)（ADR-0047）——
  # 旧出生位的**车心到最近障碍只有 1.75 m**，而安全层 `d_collision = 2.0 m`
  # ⇒ 一启动就落在 `STOP_COLLISION` 档、输出零速，车一步都不动。
  # 实测（`experiments/w6-task-eval/20261112-dense_scene-*`，20 次）：`TRACKING_SUCCESS` = **0/20**，
  # `ticks_triggered` 5,420–7,176，`clearance_min_m` 稳定 1.66–1.74 m。
  # 这曾被误读成"地图太密、车过不去"；实测证伪：面积覆盖仅 **7.2%**、相邻间隙 p50 **4.54 m**、
  # 最小 0.99 m，而车宽仅 **0.57 m** ⇒ 通道本来就在，问题在出生位与安全判据。
  #
  # 新出生位的实测口径（规划层 0.5 m 栅格，朝 goal 方向）：
  # * 安全层**方向化走廊净空 4.55 m** ≥ `d_collision = 2.0 m` ⇒ 不会被误停（ADR-0047）。
  # 注意：这**不**等于"车能到达 goal" —— 占位规划器仍只发几何直连，真正的全局路径
  # 规划尚未实现（ADR-0032 方向 2 / 主链任务）。出生位修好只消除了"一启动即零速"。
  # 出生位**随地图派生**（ADR-0036），此处是唯一来源；场景层不得再覆盖。
  per_map:
    dense_map:
      car:
        x: -40.0
        y: -6.0
        yaw: 0.0
      target:
        x: 0.0
        y: 0.0
      own_uav:
        x: -34.0
        y: -2.0
    # ---- `sparse_map`（ADR-0049）：可通行正例图 ----
    # 与 `dense_map` **逐值相同**的出生位，使两图可直接对照（唯一变量是障碍密度）。
    # 三条设计目标（ADR-0036）实测：
    #   车↔目标 34.53 m（>=30）✓  己方机↔目标 34.06 m（>=25）✓  车↔机 4.00 m（∈[3,8]）✓
    # `goal_offset_m` 沿用顶层缺省 ⇒ 派生任务目标 = (-2.5, 0)，距目标 2.50 m <= d_track 3.0。
    # **注意**：`dense_map` 的车位是 (-40,-6)（ADR-0047 为避开出生即停车而外移）；
    # 本图不需要那个外移 —— 它的障碍最小中心距 4.0 m，出生位侧向净空充足。
    sparse_map:
      car:
        x: -34.0
        y: -6.0
        yaw: 0.0
      target:
        x: 0.0
        y: 0.0
      own_uav:
        x: -34.0
        y: -2.0

