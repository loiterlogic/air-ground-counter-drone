# W6 场景族**基参数**（由 w6.launch.py（backend 参数化）与 config/scenarios.yaml 的场景覆盖合并后
# 单一注入；契约 #params）。节点不得覆写。
task_manager:
  ros__parameters:
    world_name: "agc_world"
    goal_topic: "/agc/ground/goal"
    # F1（2026-10-31）跟随出生布局：`goal_follow_target:false` 的场景以本固定点为任务目标，
    # 而 C8 判据要求**车↔目标** ≤ d_track=3.0 m（GROUND_APPROACH 的有效拍）——故任务目标必须
    # 落在目标出生位附近，不能停留在旧布局的 (4,3)。
    # 取值 = 目标出生位 (15,-2) 向西 2.50 m（旧布局同为 2.55 m 的同类关系），仍在中央作业坪内。
    # 布局改了就同步改这里（`tests/w6_geometry_check.py` 的 (g) 组会核对三组距离）。
    goal_x: 12.5
    goal_y: -2.0
    goal_follow_target: false
    # R-041：目标失效策略 =「保留有期限的最后有效目标」。目标失效时在 goal_hold_valid_s 窗口内保持
    # 最后有效目标的**原位置 + 原源时刻**（不刷新 stamp、不反射固定点）；超窗显式失效（地面安全停车）。
    goal_hold_valid_s: 1.0
    # R-041：目标有效性 / 身份 / 时刻的伴随诊断话题（std_msgs/String，transient_local，非命令者）
    goal_info_topic: "/agc/ground/goal_info"
    odom_valid_topic: "/agc/ground/odom_valid"
    cmd_topic: "/agc/ground/cmd_vel"
    state_topic: "/agc/task/state"
    # 运行模式（R-001）：基参按"无空中链路"声明（backend:=lightweight 复用 m0_skeleton）；
    # backend:=full 起真实空中链路，在合并后强制覆写为 true（相位复位门禁 C5 强制）
    air_present: false
    # W7-b（步 1·甲-1）：空中控制权交接——整链（air_present=true）下，门禁通过后本节点**等「起飞完成
    # （悬停）」**再显式触发 release_control（takeoff_controller → trajectory_tracker）。悬停判据 =
    # `/agc/air/odom` 世界 ENU z 相对**起飞前基准**（本 run 最小 z，即地面高度）的爬升量 ≥ air_hover_climb_m
    # （m），默认 2.3 与 air.yaml 的 takeoff_altitude_m=2.5 / hover_tolerance_m=0.25 对齐（2.5−0.25≈2.25）；
    # air_hover_timeout_s 为有界等待上限，超时则如实拒绝 start（INFRA_FAILURE）。轻量栈整段跳过。
    release_service: "/agc/air/release_control"
    air_odom_topic: "/agc/air/odom"
    air_hover_climb_m: 2.3
    # 放宽（2026-10-20）：本机 PX4 EKF/GPS 间歇性慢热 → 18 s 常在起飞完成前超时（实测 infra 偏高）。
    # 放宽到 45 s 仅**放宽启动容忍窗口**，不改判定阈值（契约 #params）；须配 runner `--start-timeout-s`。
    air_hover_timeout_s: 45.0
    ground_controller_name: "agc_rl"
    d_track_m: 3.0
    t_dwell_s: 3.0
    t_max_s: 120.0
    # ADR-0014：tracking_milestone 是否**等价终态**。缺省 true = 既有行为（达驻留即 TRACKING_SUCCESS 锁存）。
    # capture 场景（`interception_authorized: true`）在场景层覆盖为 false：里程碑只记指标
    # （`tracking_milestone_met` 仍发布），**不**提前锁存终态 → 保持 GROUND_APPROACH 交火窗口，
    # 结局交由 capture_adjudicator（CAPTURE_NET）或 t_max TIMEOUT 决定。单一注入，节点不得覆写。
    tracking_milestone_is_terminal: true
    # R-013：复位后 odom_valid / 地面 odom 新鲜度上限（s）；cmd_vel 回环沿用 0.5（代码常量）
    odom_valid_max_age_s: 1.0
    # R-018：干扰终态只由「已确认事件」驱动（jammer 观测真实 nav_state 持续达标后发布）
    jam_confirm_topic: "/agc/task/jam_confirm"
    # R-021：episode 身份（epoch）+ 捕获配套事件结算话题（单一注入，节点不得覆写）
    epoch_topic: "/agc/scenario/reset_epoch"
    capture_event_topic: "/agc/task/capture_event"
    # R-022：命令幂等 / 终态锁存——reset 调用超时（s；超时/取消判非确定性，不误置状态）+
    # 新 episode 标识发布话题（std_msgs/Int32，transient_local，非命令者，供 R-021 配套事件关联）
    reset_call_timeout_s: 8.0
    episode_topic: "/agc/task/episode"
    # R-023：dwell 逐拍判据——车地面 odom 寿命门 + 分段有效时长事件（std_msgs，非命令者）
    car_odom_max_age_s: 1.0
    dwell_event_topic: "/agc/task/dwell_event"

scenario_reset:
  ros__parameters:
    world_name: "agc_world"
    state_topic: "/agc/task/state"
    car_start_topic: "/agc/scenario/car_start"
    # F1（2026-10-31）：出生布局坐标的**单一真源**是 `config/spawn_layout.yaml`——`w6.launch.py`
    # 读取后经 launch 参数**显式覆盖**下列值，使「世界 spawn / 复位 / 己方机起飞参考」三处取同一
    # 组坐标。此处数值仅作 **standalone 回退**（不经 w6 入口、直接 `ros2 run agc_task
    # scenario_reset` 时使用），不构成第二份布局真源；现回退值 = `spawn_layout.yaml` 的车/目标位
    # （z 取复位口径），使两条路径不再互相矛盾。
    car_x: -15.0
    car_y: 1.0
    car_z: 0.010
    car_yaw: 0.0
    target_x: 15.0
    target_y: -2.0
    # 2026-11-05：2.0 → 0.12（与 `spawn_layout.yaml` 的 target.z 同步；本值仅作 standalone 回退）。
    # 理由见 spawn_layout.yaml 的 target 段：原 2.0 会让目标在 PX4 attach 前自由落体砸地。
    target_z: 0.12
    target_yaw: 0.0
    # C7 出生净空下限（ADR-0012；旧值 2.4 m 作废）；R-014 起为**车↔目标对**下限（标定值）
    spawn_clearance_min_m: 6.0
    # R-014 出生净空统一候选校验（ADR-0012）：实体几何外伸（半长/半宽）暂定值，待实测回填
    clearance_radius_car_m: 0.5037
    clearance_radius_uav_m: 0.25
    clearance_radius_obstacle_m: 0.15
    # 实体对下限显式覆盖：< 0 表示按两实体外伸之和（r_a + r_b）推导
    clearance_min_car_own_uav_m: -1.0
    clearance_min_target_own_uav_m: -1.0
    clearance_min_car_obstacle_m: -1.0
    clearance_min_target_obstacle_m: -1.0
    # 作业区边界（map 系）与静态障碍清单**不**在此硬编码：由单一几何真源
    # `agc_sim/config/world_geometry.yaml` 经 composition（`w6_composition.compose_params`）
    # **派生注入** `map_x_min/x_max/y_min/y_max` 与 `obstacle_names/obstacle_x/obstacle_y`
    # （见 S-06 / ADR-0007）。scenario_reset.cpp 的默认值仅为 standalone 回退。
    # 显式运行模式（同 R-001 air_present 原则：不得由实体缺席推定）；backend:=full 透传己方机 spawn 位
    own_uav_present: false
    own_uav_x: 0.0
    own_uav_y: 0.0
    spawn_randomize: false
    spawn_seed: 0
    spawn_search_radius_m: 3.0
    # R-015（ADR-0014）复位受控事务：实体名 / 真值旁路 gt 话题 / epoch 话题 / 读回容差与超时 /
    # 静止观察窗口。**单一注入**（节点不得覆写，契约 #params）。
    car_entity_name: "agc_car"
    target_entity_name: "intruder_uav"
    car_gt_topic: "/agc/gt/agc_car"
    target_gt_topic: "/agc/gt/intruder_uav"
    reset_epoch_topic: "/agc/scenario/reset_epoch"
    ground_odom_topic: "/agc/ground/odom"
    readback_tolerance_m: 0.25
    readback_timeout_s: 1.0
    readback_max_age_s: 0.5
    stop_exec_max_s: 0.5
    quiescence_eps: 0.05

# R-016（ADR-0014）入侵者 episode 起点协议：契约 #params 单一注入（节点不得覆写）。
# 场景覆盖（motion/speed_mps/radius_m 等）由 config/scenarios.yaml 合并后透传（w6.launch.py 按 backend）。
intruder_driver:
  ros__parameters:
    px4_ns: "px4_1"
    target_system: 2
    motion: "static"
    # ---- H0（2026-11-02）：巡航高度**唯一权威输入** ----
    # `cruise_alt_m` = 目标相对 **episode 原点**（epoch 后首帧 odom，ADR-0014）的巡航上升量
    # （m，向上为正）。它**不是**世界 ENU 高度：绝对世界高度 = 原点世界高度 + 本值，而原点
    # 世界高度由 EKF 初始化决定、跨 run 不可复现（H0 实测 `gt_z − (−ned_z)` 漂移 −0.50…+0.44 m）。
    # 世界放置值另有其家：`config/spawn_layout.yaml` 的 `target.z`（PX4 attach 前的瞬态，
    # **不是**巡航高度，也不与本节叠加）。
    #
    # 取值依据（H0 round-3 T2 实测，run `20261102-h0-altitude-semantics-101057-*`）：
    #   世界 spawn 2.0 在 PX4 attach 后落到地面（gt_z≈−0.015），驱动随后按本值爬升；
    #   实测世界高度稳态 2.09 m（中位），落在 `capture_adjudicator` 适用高度
    #   `[0, applicable_max_alt_m=2.009]` 与 `jam_envelope_max_alt_m=2.0` 的边界内，
    #   并与 `air.yaml` 的己方跟踪高度 2.5 m 形成 0.41 m 高差（远小于感知 range_max 30 m
    #   与 standoff 水平预算 √(30²−0.41²)=29.997 m）→ 不改变既有能力包络。
    #   ⚠ `range_max` 原属 `air_perception`（已于 2026-11-06 随 `perception` 轴退役删除）；
    #   `/agc/targets` 由 `gt_adapter` 发布且**无几何门控**——本行只是配置自洽性验算，
    #   常量 R=30.0 的登记处见 `air.yaml` standoff_follower 注释 / 飞行高度规范 K1。
    # ADR-0007（2026-11-02）：**运行期由地图几何真源派生注入**（`flight_altitude.target_cruise_m`，
    # 见 `w6_composition.apply_flight_altitude_params`）。本值仅作 standalone / 单测兜底。
    # 用户裁定「高度和地图绑定，因为后面会做小障碍高密度和大障碍低密度等图」——
    # **不要在这里为某张图改数**，改地图文件。
    cruise_alt_m: 2.0
    # 弃用别名：仅为历史配置/历史 run 复现保留。与 `cruise_alt_m` 同时显式且不等 → 节点拒绝启动。
    alt_m: 2.0
    speed_mps: 1.0
    radius_m: 6.0
    # ---- ADR-0031：`epicycle`（漂移轨道）的两个专有参数 ----
    # ⚠ **命名纪律（必读，防混读）**：`drift_amplitude_m` 是**圆心**的漂移幅度，
    #   **不是**轨道半径；**轨道半径仍然是 `radius_m`**。两者语义不同、量级不同：
    #     radius_m           = 轨道半径（目标绕圆心转的圆半径）
    #     drift_amplitude_m  = **圆心**自身漂移轨迹的幅度（圆心绕 episode 原点画的圆半径）
    #   合成后的水平位移上界 = `drift_amplitude_m + radius_m`（三角不等式，见 ADR-0031）。
    # 取值依据（ADR-0031 推导链，逐条可复核；**四条同时成立**）：
    #   * 峰值速度上界 = A·(2π/T) + r·(v/r) = A·ω_c + v
    #     ⇒ 取 A=0.6 / T=30 / v=1.0 / r=1.8 ⇒ 0.1257 + 1.000 = **1.126** ≤ 1.206（火控提前量上界）。
    #   * **dwell 可达性（最紧的一条）**：A + r + goal_tol(0.3) = 2.40 + 0.3 = **2.70 < d_track_m 3.0**
    #     ⇒ 目标机在整个轨道上**恒在车的 d_track 圆内**，`RANGE_EXCEEDED` 不会中断 dwell。
    #     ⚠ 初值曾是 A=1.5 ⇒ 3.30+0.3 = 3.60 > 3.0 ⇒ dwell 会被反复清零、跟踪终态**不可达**
    #     （单测 `test_epicycle_fits_inside_car_dwell_circle` 抓到的，不是拍出来的数）。
    #   * A + r = 2.40 ≪ `run_region_radius_m` 15.0 ⇒ `_apply_region` 夹持**永不触发**
    #     （轨迹是构造上有界，不是被夹出来的）。
    #   * 观感：轨道周期 2πr/v = 11.31 s，漂移周期 30 s（≈2.65 个轨道）⇒ 每圈圆心都挪一点，
    #     不会退化成"原地绕圈"（那正是 M1 `maneuver` 被否的观感问题）。
    # 只在 `motion == 'epicycle'` 时被读取；`static` / `linear` / `maneuver` 行为**逐值不变**。
    drift_amplitude_m: 0.6
    drift_period_s: 30.0
    rate_hz: 20.0
    arm_retry_s: 2.0
    # R-017：来源为 jammer 的**已校验授权事件**（非原始命令；driver 不直订原始干扰命令话题）
    jam_state_topic: "/agc/task/jam_state"
    epoch_topic: "/agc/scenario/reset_epoch"
    # 起点协议：进入起始位姿的稳定判定（距离 / 速度 / 驻留）
    start_tol_m: 0.4
    start_vel_eps_mps: 0.35
    start_dwell_s: 0.5
    # 运行区边界：setpoint 水平离原点上限（<=0 关闭）
    run_region_radius_m: 15.0

run_logger:
  ros__parameters:
    campaign: "w6-task-eval"
    scenario: "s00"
    seed: 0
    odom_valid_topic: "/agc/ground/odom_valid"
    cmd_topic: "/agc/ground/cmd_vel"
    state_topic: "/agc/task/state"
    ground_odom_topic: "/agc/ground/odom"
    scan_topic: "/agc/ground/scan"
    collision_monitor_state_topic: "/collision_monitor_state"
    # R-027（ADR-0010）：接触真值话题（GZ contact sensor → ROS，ros_gz_interfaces/Contacts）；
    # 空字符串 = 接触真值不可用（not_applicable.collision_truth）；由 launch 单一注入（契约 #params）。
    contact_topic: "/agc/ground/contact"
    # R-027：锁轮制动减速度（m/s^2，ADR-0010 实测锁轮制动）→ 剩余停车裕度 brake_d=v^2/(2a)
    a_brake_mps2: 0.9
    # R-028（ADR-0016）：有效样本掩码的采样新鲜度上限（s）——odom 拍与最近 scan / collision
    # action 快照年龄超过此值即该拍无效（陈旧 scan 不按新 odom 重复计数）。单一注入，节点不得覆写。
    scan_max_age_s: 0.5
    action_max_age_s: 0.5
    # W7-b（ADR-0022）：可见 / 火控机会率的**固定观测时长**（s；自首个 active 拍起，**不**随终态截断）。
    # 与 `episode_runner --obs-horizon-s`（runner 让 episode 存活到该时长）**须同值**——否则窗口采不满。
    obs_window_s: 60.0
    # R-029（ADR-0006）：episode 身份话题（std_msgs/Int32，transient_local；非命令者）。
    episode_topic: "/agc/task/episode"
    # R-029：世界模型文件（sha256 记入 config/toolchain_world.json；空 = 不记）。
    world_file: ""
    # R-029：可选 PX4 根（记其 HEAD 作工具链身份；空 = 不记）。
    px4_root: ""

capture_adjudicator:
  ros__parameters:
    ground_odom_topic: "/agc/ground/odom"
    target_topic: "/agc/targets"
    hit_topic: "/agc/task/capture_hit"
    # 可交战（R-020 → W7-b T2/E2）：最小动态火控交战门；与独立干扰包络分离
    envelope_topic: "/agc/task/envelope_in"
    # R-020：捕获证据 / 标注话题（命中 / 越界 / 不可达标注；std_msgs/String）
    capture_evidence_topic: "/agc/task/capture_evidence"
    # W7-b（T2/E2）：火控事件话题（SHOT_FIRED|SHOT_HIT|SHOT_MISS；std_msgs/String，非命令者）
    fire_control_topic: "/agc/task/fire_control"
    rate_hz: 20.0
    # 网发射物理模型（可标定暂定值，实跑回填；包络由其可及集推导）
    # ADR-0007：v0 / θ / timeout 三键在**目标高度超出基线包络**时由地图派生
    # （`net_params_for_altitude`：apex = 目标高度 + 0.65 m，θ=85°，timeout = 落地 + 0.3 s）。
    # 基线（目标 2.0 m）逐值不变，故 minimal / open_field 的历史证据基线不被改写。
    net_v0_mps: 6.5
    net_angle_deg: 75.0
    net_g: 9.81
    net_diameter_m: 1.0
    net_drag: 0.9
    launcher_height_m: 0.0
    # W7-b（T2/E2）最小动态火控：展开时间 / 冷却 / 飞行超时
    net_t_exp_s: 0.2
    fire_cooldown_s: 2.0
    net_flight_timeout_s: 3.0
    # ADR-0011（2026-11-02）：**瞄准余量**——交战门不再用「水平射程 reach」判可交战，
    #   而是预演整条弹道求「网心与目标最近距离」，仅当 `最近距离 ≤ 半径 − 本值` 才开火。
    #   旧式在包络最外沿开火，余量只剩 0.18 m（默认参数）/ 0.08 m（抬到 12 m 时）/ 0.008 m（20 m），
    #   是 capture 场景「三中三不中」的直接原因。0 = 预演能擦到就开火。
    net_aim_margin_m: 0.0
    # ADR-0011（B2）：目标运动估计（时间窗最小二乘 + 静止阈值 + 新息门 + 提前量上限）
    target_fit_window_s: 1.5
    target_fit_min_s: 0.75
    target_fit_min_samples: 8
    target_static_speed_eps_mps: 0.15
    target_gate_m: 1.0
    target_pos_alpha: 0.5
    target_max_lead_m: 1.5
    # R-020：模型身份与适用范围标签（W7-b 起为**最小动态火控**口径）
    # ADR-0011：在飞生命周期与发射资格解耦（模型身份升版）；物理参数不变。
    model_id: "net_ballistic_frame_v2"
    applicable_min_alt_m: 0.0
    # ADR-0011：**上限参数已删除**（原 `applicable_max_alt_m: 2.009`）。
    #   它曾是手写第二真源，与 `gateStatus` 的 `disc<0` 是同一条件；改网参数忘改它就会
    #   「打得到却判越界」。现由节点按 `(v0·sinθ)²/(2g)` **派生**，改 net_v0_mps / net_angle_deg
    #   后上限自动跟随，不再需要、也不接受第二个数。
    # W7-b（T2/E2）：**射击授权**（任务决策，非自动）——缺省 false；按场景 outcome 轴由场景参数覆盖。
    # 未授权 → 交战门仍发布（envelope_in），但**不开火**（保持「跟踪类」场景结局不变）。
    interception_authorized: false
    # R-020：独立干扰作用包络（与网弹道模型**不同源**；std_msgs/Bool，供 jammer 门控）
    jam_envelope_topic: "/agc/task/envelope_jam"
    jam_model_id: "behavioral_range_gate"
    jam_envelope_min_alt_m: 0.0
    # ADR-0007：目标抬高后本上限由派生**只升不降**（= 目标巡航高度 + 0.5 m），
    # 否则 jam 场景恒判包络外 → 全部退化为 TIMEOUT。
    jam_envelope_max_alt_m: 2.0
    jam_envelope_max_range_m: 1.0
    # R-021（ADR-0016）：episode 身份**单一来源** = task_manager 的 `/agc/task/episode`（非物理 reset epoch）
    task_state_topic: "/agc/task/state"
    episode_topic: "/agc/task/episode"
    # 配套事件（ep / 时刻 / target；std_msgs/String，非命令者，不改冻结 9 消息 ABI）
    capture_event_topic: "/agc/task/capture_event"
    car_max_age_s: 0.5
    target_max_age_s: 0.5
    confidence_min: 0.5
    # 空 = 不校验身份；非空 = 仅当 target_id 匹配才允许产出命中
    required_target_id: ""

jammer:
  ros__parameters:
    px4_ns: "px4_1"
    target_system: 2
    cmd_topic: "/agc/task/jam_cmd"
    state_topic: "/agc/task/jam_state"
    # R-020：干扰门控改用**独立干扰作用包络**（与捕获包络 /agc/task/envelope_in 分离）
    envelope_topic: "/agc/task/envelope_jam"
    # R-017：包络新鲜度上限（s）——过期视同包络外；仅「合法 + 包络新鲜」才产出已校验授权事件
    envelope_max_age_s: 0.5
    # R-018：真实行为确认（契约 #params 单一注入，节点不得覆写）——订入侵者 PX4 VehicleStatus，
    # 仅当真实 nav_state 达到所命令模式且持续 ≥ jam_sustain_s 才产出「已确认事件」
    vehicle_status_topic: "/px4_1/fmu/out/vehicle_status"
    confirm_topic: "/agc/task/jam_confirm"
    evidence_topic: "/agc/task/jam_evidence"
    jam_sustain_s: 1.0
    jam_confirm_window_s: 3.0
    # R-019：`LOST`（仅断 Offboard，**不**发 SET_NAV_STATE）的确认期望 nav_state。
    # = 运行时锁定 COM_OBL_RC_ACT 的映射（默认 0 = Position → POSCTL = 2）；真源见
    # config/px4_failsafe_lock.yaml（由 scripts/lock_px4_failsafe_params.sh 注入 SITL 启动参数）。
    lost_expected_nav_state: 2
