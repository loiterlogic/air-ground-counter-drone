# AGC 场景配置文件 · 地图 `sparse_map`（**可通行**正例图）
#
# 本文件由 `scripts/gen_sparse_map.py` 一次性生成；生成后**本文件即唯一来源**，
# 核验器 `tests/check_sparse_map_layout.py` 只读本文件。
# 人工改过之后不要再跑生成器（会覆盖）。
#
# ---- 用途（ADR-0049）----
# `dense_map` 在 ADR-0041 风险分档下对本车**几何不可通行**（圆盘连通阈值
# R ≤ 0.70 m，本车需 0.933 m）。它的正确定位是**高密度感知压力图 +
# 几何不可行负例**。本图是它的正例对照：障碍足够稀疏，保证本车在 0.5 m
# 规划层上**任意航向**都能找到连通通道。
#
# ---- 最小中心距的推导（不是拍的）----
#   D_center >= 2*r_vehicle + 2*r_inflation + delta_grid + delta_margin
#     r_vehicle   = hypot(0.5037, 0.28545) + 0.3536 = 0.933 m（半对角 + 半格量化）
#     r_inflation = 0.6 m（ADR-0041 的 99 环半径）
#     delta_grid  = 0.5 m（规划层格宽）
#     delta_margin= 0.2 m（额外裕量）
#   => D_center >= 3.765 m。取 **4.0 m** 留 0.235 m 吸收「任意航向」的离散误差。
#
# ---- 与 dense_map 的对照 ----
#   dense_map : 间距 2.645 m，每道缝（扣 99 环 + 格宽）0.85 m < 车需 2.14 m => 不可通行
#   sparse_map: 间距 4.0 m，每道缝 2.30 m >= 车需 2.14 m => 可通行
#
# ---- 生成参数（可复现）----
#   种子 20261114，目标实体数 150，实际落点 150，尝试 67575 次
#   撒点区 70×70 m（x,y ∈ [-35,35]），目标口袋 r=6 m，出生位 pad 车 2.0 / 机 1.5 m
#   尺寸：box 0.6–1.2 m / cylinder r 0.25–0.40 m；高度 0.6–3.0 m（8 档）
#
# ---- 边界（不得误读）----
# * **不改 dense_map 的语义**：它是负例，不是"待修的图"。
# * **不新增任何模式开关**：`sparse_map` 是**地图资产选择**（`world_map`），
#   不是 `planner_mode` / `dense_map_mode` 之类的运行时路线分支
#   （路线分支治理：地图 / 模型文件选择不算分支）。

