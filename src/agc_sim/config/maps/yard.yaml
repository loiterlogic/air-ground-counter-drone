# AGC 场景几何真源 · 地图 `yard`（P1-1 演示主地图）
#
# 本文件受 `world_geometry.yaml` 头部 schema 与纪律约束（唯一真源 / 按域派生 / 障碍族边界）；
# 此处只记**本图专属**布局意图与实测边界，schema 定义不在此复述。
#
# ---- 为什么是这张图（来源：用户）----
# 2026-10-29 原话：「当前地图太过空旷简单，只有两个生成的障碍物。缺少合适的地图。」
# 同日 15:39：「① 删除 yard 的 pole_1/pole_2；② 中央大块空区重做布局，增加尺寸 / 形状 /
#   **朝向**多样性，中央要有可见内容，且保留地面与空中可行通道、C7 净空、碰撞/视觉一致；
#   ③ 关闭 GUI 网格」。
# 同日 17:00：「不够精致，障碍物大部分都是一大块一大块的，缺少小型障碍物…能不能再精致一点」
#   → 引入 **sphere 图元**与**复合模型**（`parts`）。
# 同日 18:44：「80*80 可能不太够，改成 100*100，然后重新布局障碍物分布和数量以及样式，
#   样式要考虑现实世界中正常情况下是怎么分布的，先学习别人怎么做，**一定是设计好大致分布再动手**」
#   → 作业区 80×80 → **100×100**；yard 重做为**现实工业物流场站**（分区 + 正交对齐 + 道路留白
#   + 尺寸长尾 + 中央空场保留）。取证来源：本机同版本可运行实现
#   `nav2_minimal_tb4_sim/worlds/warehouse.sdf`（货架成排对齐 / 隔离墩成列 / 小件成组）
#   与 PX4 官方世界 `baylands.sdf`（GUI 相机预设写法）。
# 同日 21:00 **再次裁定（本轮）**：「建筑和地面精细度不高，能不能优化，比如材质改变，颜色分配
#   优化。二是小型物体（路牌这种）现在有点少，略微增加不要过分密集。网页看不了就不看了，
#   学习本地能看的就行，依旧设计好了再动手」
#   → 引入**材质档 `finish`**（标量 PBR）+ **按功能分族的配色** + **建筑细部构件** +
#     **地面分层**（道路 / 场坪，在 `worlds/agc_world.sdf`）+ **+7 个小型件**。
#
# ---- 材质档 `finish`（本轮新增 schema；标量 PBR，**不需要贴图**）----
#   依据：本机 **sdformat 1.11** `material.sdf` 中 `<pbr><metal>` 的 `<metalness>` / `<roughness>`
#   是**标量**字段（默认 0.5），无需任何贴图 → 不违反"不引入外部资产"（world_geometry.yaml 纪律）。
#   合法值（非法值**拒绝运行**，见 `world_map.FINISHES`）：concrete / steel / paint / glass /
#   rust / asphalt / rubber / **roofpanel**（R6 新增）。**缺省不写 = 旧行为**（无 `<pbr>` 块，
#   保证 minimal / open_field 与历史证据不漂移）。逐 part 可覆盖实体级 `finish`。
#   | finish | metalness | roughness | 语义 |
#   |---|---|---|---|
#   | concrete | 0.00 | 0.90 | 混凝土（墙 / 勒脚 / 檐口 / 基础 / 围墙） |
#   | steel    | **0.35** | **0.42** | 结构钢 / 罐体 / 管廊 / 灯杆 / 法兰（R6 由 0.75/0.35 下调） |
#   | paint    | 0.15 | 0.45 | 涂装金属（集装箱 / 卷帘门 / 配电箱 / 标牌 / 岗亭） |
#   | glass    | 0.05 | 0.08 | 玻璃（窗带 / 门厅 / 天窗），diffuse 压暗到 0.72 出深色玻璃感 |
#   | rust     | 0.10 | 0.95 | 锈蚀件（预留） |
#   | asphalt  | 0.00 | 0.95 | 沥青（场地道路，在 `agc_world.sdf`） |
#   | rubber   | 0.00 | 0.80 | 橡胶 / 塑料（锥桶、灌木球等） |
#   | **roofpanel** | 0.06 | 0.40 | **金属屋面板**（R6 新增；低金属度 → 无环境贴图时仍读作浅色板） |
#
# ---- 明度带（R6，2026-10-30 用户裁定「建筑与地面区分度低」）----
#   判据（断言 (q)）：**屋面 albedo L − 基层地面 albedo L ≥ 0.30**。
#   | 层 | 目标 L | 实值 |
#   |---|---|---|
#   | 基层地面 | 0.42–0.48 | **0.396**（`agc_world.sdf` 非贴图段以 paper 白 + 贴图承载颜色） |
#   | 沥青道路 | 0.20–0.24 | 0.208 |
#   | 混凝土场坪 | 0.55–0.60 | 0.575 |
#   | 屋面 | 0.78–0.86+ | **0.877**（roofpanel） |
#   | 檐口 / 女儿墙 | 0.55–0.62 | 0.553 |
#
#   **R6 实测的关键教训（不写下来会重踩）**：`metalness` 才是渲染亮度的杠杆。无环境贴图时
#   高金属度几乎不给漫反射分量 —— 原 `steel`(0.75) 屋面在 118 m 俯视渲染里只有 **83/255**，
#   而旁边 `concrete`(0.00) 檐口是 **161/255**。也就是说：**给金属件提亮 albedo 是无效的**。
#
# ---- 配色分族（V2：按功能分族、族内一致）----
#   * 生产仓储：混凝土冷灰墙 + **银灰蓝**金属屋面 + 深灰女儿墙压顶；
#   * 办公：暖灰墙 + **深蓝绿玻璃窗带**（逐层）；
#   * 罐区：银白钢罐，**仅一台标识罐**用暖橙；管廊中灰 + 深灰法兰；变电站钢灰 + 灰绿配电柜；
#   * 集装箱：**同一排同色**（现实按批号 / 船公司成排堆）——锈红排 / 蓝排 / 绿排 / 土黄排，
#     第五个箱位留空（真实堆场不是满格）；
#   * 维修：混凝土墙 + 深钢卷帘门框 + **亮蓝灰**卷帘门；
#   * 路缘家具：锥桶橙、石墩浅混凝土、花坛绿、标牌黄、灯杆深钢、消防栓红、垃圾箱墨绿、
#     配电箱灰绿、岗亭白墙蓝顶。
#
# ---- 建筑细部（V3：让"建筑"像建筑）----
#   每栋大体量建筑：**勒脚**（底部外扩防撞带）+ **女儿墙压顶** + **金属屋面板** +
#   逐层**窗带**（微凸出墙面的真几何，不是贴图）+ **卷帘门 / 玻璃门厅** + **台阶** +
#   **屋顶设备** + **雨棚 / 月台 / 门廊柱**。塔罐加**基础环**与**爬梯**，管廊加**法兰**。
#
# ---- 地面分层（V4，在 `worlds/agc_world.sdf`，**不是**障碍）----
#   基层混凝土 `ground_plane`（200×200）+ 一圈**沥青环形主路**（东西各一条 / 南北各一条）
#   + 南门与北侧支路 + 中央**混凝土作业坪** + 两处场坪（维修区 / 配送库前）。
#   三者都是地面：**不进**本文件 `obstacles`、不进空中安全层、不进感知占位栅格；
#   视觉与碰撞同源（不做装饰性无碰撞块）；抬升 2–6 mm 避免与基层共面 z-fighting。
#
# ---- 分区（世界 ENU，m；作业区 [−50,50]²）----
#   北外环 y 26..40   ：主厂房 hall_north / 仓库 hall_northeast / 办公楼 admin_block / 配电房 power_house
#   东区   x 26..46   ：罐区 tank_farm_e（含防火堤 / 基础环）/ 管廊 pipe_rack_e / 变电站 substation_e
#   南外环 y −44..−26 ：集装箱堆场 container_yard_a / 库房 warehouse_south / 配送库 depot_east
#   西区   x −46..−26 ：维修车间 workshop_w / 办公楼 office_w
#   中央南带 y −13..−22：集装箱堆场 container_yard_b / 薄板堆 slab_s / 筒仓 silo_s / 工具房 hut_s /
#                        隔离墩列 jersey_row / 锥桶列 cone_row / 石墩列 bollard_row / 花坛列 planter_row
#   中央北带 y  9..13  ：监控塔 tower_n / 双罐 tank_pair_n / 指路牌 sign_a
#   南门 / 环路沿线    ：岗亭 guard_booth / 道闸 boom_gate / 大门标牌 sign_gate / 指路牌 sign_b /
#                        消防栓 hydrant_a / 配电箱列 cabinet_row / 垃圾箱列 dumpster_row（本轮新增）
#   周界              ：围墙 wall_n / wall_s / wall_w / wall_e（30–34 m 分段长墙 + 压顶，段间即门洞）
#
# ---- 实测边界（`python3 tests/w6_geometry_check.py` 断言 (o)(p) + 本图离线核验，2026-10-29）----
#   * 实体 **36** 个；图元 **186** 个；形状 **3** 类（box / cylinder / sphere）；小型件 **19** 个；
#     复合模型 **34** 个；材质档本图用到 **5 类**（concrete / steel / paint / glass / rubber；`asphalt` 用于地面，见 `agc_world.sdf`；`rust` 预留）；yaw 种类 **12** 种（含正交主向）。
#   * 障碍外接矩形 **X −46.2..+46.2（92.4 m）/ Y −45.4..+45.4（90.9 m）**——占 100×100 作业区约 84%。
#   * **并集**投影覆盖 **10.89%**（判据 5%–12%，断言 (o) `coverage_union_in_5_12`）；图元和 28.5%
#     （图元和含复合体堆叠的重复计数，只作参考，**不作判据**）。
#   * 中央（原点 15 m 内）**4** 个实体；**8 字轨迹净空 +1.31 m**（最紧 sign_a）；**待机环带**
#     可行 **81.53%**、最长连续可行弧 **293.5°**；**C7 出生净空** 车 +8.67 / 目标 +6.49 / 己方机 +9.04 m；
#     **实体互不重叠**（逐图元 SAT 判定）。
#
# ---- 覆盖口径（成文）----
#   判据用 **并集**投影面积 / 作业区面积（同一实体多图元堆叠只计一次）。
#   旧记录里的 `7.36%` 既不是并集也不是图元和，来源不可复现，**已作废**；断言 (o) 新增并集覆盖
#   检查，使"5%–12%"第一次可自动判定。
#
# ---- 障碍族边界（ADR-0009）----
#   所有图元在 z=0.48（地面激光扫描面）处均有水平截面 → 对地面激光可见（逐图元判定）；
#   本图**无**悬空结构 / 薄片：窗带、勒脚、压顶、屋面设备、雨棚均附着在"自身在 z=0.48 处已有
#   截面的本体"上，属整体足迹的一部分。视觉与碰撞同源（同一 `<geometry>` 片段注入 collision 与 visual）。
#
# ---- 已知限制（如实登记，不假装能力）----
#   * 空中安全层是**二维静态圆盘**（ADR-0009）：圆盘半径 = 实体**水平外接圆半径**（含安全余量）。
#     细长实体的外接圆半径 ≈ 半长，故**不能**用一根 100 m 通长围墙闭合场站；本图用 30–34 m
#     **分段长墙 + 段间门洞**（既贴现实，又使每段圆盘远离 8 字空域）。
#   * 无贴图 / 无 mesh（不引入外部资产）→ 材质只有**标量 PBR + 纯色**，出不了纹理细节；
#     再往上要贴图就必须走 ADR-0005 的 provenance / 许可 / 哈希登记。
#
# ---- 派生约定（`w6_composition` / `world_map` 单一实现）----
#   `safety_radius` = 实体**全部 part** 的水平外接圆半径（未写则自动推导，见 world_map.py）；
#   感知先验把复合体 / cylinder / sphere **降级为水平轴对齐包络矩形**（保守外扩，不缩小实体）。
#   `finish` 只进物理世界的 `<material>`，**不进**感知先验 / 占位栅格（材质不是几何）。
map: yard

work_area:
  resolution: 0.5
  size_x: 100.0
  size_y: 100.0
  origin_x: -50.0
  origin_y: -50.0

# ---- 飞行高度（ADR-0007；用户 2026-11-02 裁定「高度和地图绑定」）----
# 本节是**本图固定飞行高度的唯一真源**。运行期由 `w6_composition.apply_flight_altitude()`
# 派生注入 `air.yaml` / `w6_base.yaml` 的同名参数；`air.yaml` 里的同名键只作 standalone /
# 单测兜底，**运行期一律被本节覆盖**（与 `safety.obstacle_*` 的派生处理同款）。
#
# 为什么高度是**地图属性**（不是场景参数）：用户原话「这是和地图绑定的，因为后面会做
# 小障碍高密度和大障碍低密度等图」。换图即换高度，**代码一行不动**。
#
# 五键语义（与 `docs/conventions/飞行高度分层与按地图定高.md` 的 L2a/L2b/L2c 对应）：
#   own_track_m        —— 己方机跟踪高度（L2b → standoff_follower.height）
#   own_takeoff_m      —— 己方机起飞高度（L2c → takeoff_controller.takeoff_altitude_m）
#   target_cruise_m    —— 目标机巡航高度（L2a → intruder_driver.cruise_alt_m 的**默认值**）
#   own_clearance_min_m—— 垂直净空下限 c_clear（K3）
#   derived            —— 本图几何的派生量（只读；由 `height_survey` 同口径算出，供断言比对）
flight_altitude:
  own_track_m: 14.0
  own_takeoff_m: 14.0
  target_cruise_m: 12.0
  own_clearance_min_m: 0.5
  derived:
    h_max_map_m: 10.55          # admin_block（全图最高）
    h_max_map_id: admin_block
    h_max_env_m: 7.975          # 作业包络内最高：tank_farm_e（目标会平移时）
    h_max_env_id: tank_farm_e
    rule_version: 1
  # 取值依据（逐条已验算，见 ADR-0007）：
  #   * 用户裁定「目标 12 / 己方 14」（dz=2.0）。目标 12 m 高于本图**全图最高**建筑 10.55 m
  #     → 演示上"明显高于建筑"成立，且不再需要改相机视角去规避。
  #   * K3 净空：14 − 10.55 = **3.45 m** ≥ c_clear(0.5) ✓（旧值 2.5 时为 −8.05 m，即比楼低）
  #   * K1 感知量程（`range_max_m = 30.0`）：dz=2.0 → 水平预算 √(30²−2²) = **29.93 m** ≥ 停止点 10.2 m ✓
  #   * K2 相机 vfov：俯仰角 atan(2/10.2) = **11.1°** ≤ 35° ✓
  #   * 三维斜距：√(10.2²+2²) = **10.39 m** ≤ range_max 30 m ✓
  #   * 原「c_clear ≤ 0.35 m」死结（h_t=2.0 时 K1 上限只有 8.33 m）**随抬高度与量程修正自动消失**：
  #     现 K1 上限 = h_t + 28.21 m；实际**先绑定的是 K2**（h_t + 7.14 m），仍远大于本图所需。
  #   * ⚠ K1/K2 在 `gt_adapter` 单源下**都不在运行期生效**（真值链路无几何门控，
  #     `air_perception` 无消费者）——本节是**配置自洽性**验算，不是运行期限制。

