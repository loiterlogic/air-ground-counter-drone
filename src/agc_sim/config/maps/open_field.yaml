# AGC 场景几何真源 · 地图 `open_field`（P1-1 能力对照地图）
#
# 本文件受 `world_geometry.yaml` 头部 schema 与纪律约束；此处只记**本图专属**意图与边界。
#
# ---- 用途 ----
# **能力对照 / 快速回归**：证明「空旷下也正常」，并作为 headless 批量跑的经济地图
# （障碍少 → 物理与遮挡开销低）。它不是演示主地图——演示主地图是 `yard`。
#
# ---- 布局（世界 ENU，m）----
#   shed  (24, 20) 8×6×3                                  —— 唯一建筑
#   cyl_1 (-16, 12) | cyl_2 (18,-14) | cyl_3 (-18,-16) | cyl_4 (26, 4)，均 r=1.2 h=2.5
# 车 (-4,-3) ↔ 目标 (6.5,2.5) 直线距离 11.85 m（s04 出生位不变）；
# 车→任务目标 (4,3) 直线到最近实体足迹净空 **17.90 m**（本图无障碍穿越需求）。
#
# ---- 设计约束 ----
#   * 障碍实体 **5** 个；覆盖面积 **1.03%**（稀疏，对照用，不追 5%–12% 演示目标）。
#   * 空中安全层可行性：新增障碍在目标周围 [8,15] m 待机环带内**零阻塞单元**，
#     环带可行率 **100%**（minimal 84.1% 的阻塞全部来自既有 pole_2，本图无 pole）。
#   * 障碍族边界：5 个实体在 z=0.48 处均有水平截面 → 对地面激光可见。
#   * **无 pole_\***：本图不参与「(b) 断言依赖 pole_* 命名」——该断言跑在 `minimal` 上，
#     三图核查按「派生 == 各自真源」逐图判定，不要求每张图都含 pole。
#   * 作业区随用户 2026-10-29 裁定统一为 **100×100 m（origin −50,−50）**；本图障碍布局未动
#     （对照图的价值在于"与 yard 同一作业区、障碍极少"，故障碍分布**故意**保持稀疏）。
map: open_field

work_area:
  resolution: 0.5
  size_x: 100.0
  size_y: 100.0
  origin_x: -50.0
  origin_y: -50.0

obstacles:
  # ---- 唯一建筑 ----
  - id: shed
    shape: box
    x: 24.0
    y: 20.0
    z: 1.5
    yaw: 0.0
    size: [8.0, 6.0, 3.0]
    color: [0.58, 0.56, 0.52]
    safety_radius: 5.000
  # ---- 稀疏圆柱 ----
  - id: cyl_1
    shape: cylinder
    x: -16.0
    y: 12.0
    z: 1.25
    yaw: 0.0
    size: [1.2, 1.2, 2.5]
    color: [0.70, 0.46, 0.24]
    safety_radius: 1.200
  - id: cyl_2
    shape: cylinder
    x: 18.0
    y: -14.0
    z: 1.25
    yaw: 0.0
    size: [1.2, 1.2, 2.5]
    color: [0.70, 0.46, 0.24]
    safety_radius: 1.200
  - id: cyl_3
    shape: cylinder
    x: -18.0
    y: -16.0
    z: 1.25
    yaw: 0.0
    size: [1.2, 1.2, 2.5]
    color: [0.70, 0.46, 0.24]
    safety_radius: 1.200
  - id: cyl_4
