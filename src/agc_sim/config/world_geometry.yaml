# 场景几何与飞行高度：minimal 地图的作业区与静态障碍（ADR-0007）。
# 由 composition 按地图名加载并派生注入；节点不得覆写。
# 改几何只改对应地图文件，再跑 tests/check_scene_geometry.py 复核。
map: minimal

work_area:
  resolution: 0.5
  size_x: 100.0
  size_y: 100.0
  origin_x: -50.0
  origin_y: -50.0

# 本图固定飞行高度；运行期由 composition.apply_flight_altitude_params 派生注入（ADR-0007）。
flight_altitude:
  own_track_m: 2.5
  own_takeoff_m: 2.5
  target_cruise_m: 2.0
  own_clearance_min_m: 0.5
  derived:
    h_max_map_m: 3.0            # pole_1 / pole_2
    h_max_map_id: pole_1
    h_max_env_m: 0.0            # 两柱距目标 14.14 / 17.82 m，均在 11.2 m 环带外
    h_max_env_id: null
    rule_version: 1

# 基线双柱（ADR-0007）；安全圆盘半径与场景复位净空校验同源。
obstacles:
  - id: pole_1
    shape: box
    x: 0.0
    y: -6.0
    z: 1.5
    yaw: 0.0
    size: [0.3, 0.3, 3.0]
    color: [1.0, 0.0, 0.0]
    safety_radius: 2.0
  - id: pole_2
    shape: box
    x: 6.0
    y: 6.0
    z: 1.5
    yaw: 0.0
    size: [0.3, 0.3, 3.0]
    color: [0.0, 0.0, 1.0]
    safety_radius: 2.0
