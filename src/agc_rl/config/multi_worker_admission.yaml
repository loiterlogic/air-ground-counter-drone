# 扩容准入预声明分析计划（ADR-0024）——配置文件。
# 在任何 A / B / P 对照 run 之前写定；首个 run 之后不得修改；偏离单独登记。
w7c_admission_plan:
  version: 1
  date: 2026-10-25
  status: frozen_before_runs
  scope: "多 worker 扩容准入指标、A/B 隔离对照、两 worker 条件性重试、时间线归因与回退"
  reference_run: {campaign: w7-rl-b, scene: s08_static_none_nominal_capture,
                 arm: p2_rl_high, seed: 0, backend: full, mode: headless}

  conditions:
    A: {description: "普通单 worker（默认路径，无 netns / private /tmp / PX4 run root）", n: 3}
    B: {description: "隔离单 worker（w7c_worker_run.py --worker-id 0；netns + private /tmp + UDPv4 + 唯一 GZ_PARTITION + 私有 PX4 run root）", n: 3}
    P: {description: "两个隔离 worker；仅 A/B 门通过且无 unexplained 时启动", conditional: true,
        n_pairs: 3, workers: [0, 1], compare_against: B}

  fixed_conditions:
    backend: full
    scene: s08_static_none_nominal_capture
    seed: 0
    arm: p2_rl_high
    mode: headless
    infra_retries: 0
    startup_protocol: {own_px4_delay_s: 25.0, intruder_px4_delay_s: 35.0,
                       px4_warmup: false, air_odom_gate: true}
    alternation: "A/B/A/B/A/B"
    run_id_policy: "每个 run 新 run_id；不覆盖；失败 / infra 全保留"

  parameter_initial_state:
    mode: canonical_seed_copy
    canonical_source: "toolchain/PX4-Autopilot/build/px4_sitl_default/parameters.bson（系列开始前快照）"
    reset_before_each_run: true
    reset_scope:
      A: "共享 build 的 parameters.bson / parameters_backup.bson 从 canonical seed 覆盖后启动"
      B: "worker 私有 instance_0 / instance_1 的 parameters.bson / parameters_backup.bson 从 canonical seed 覆盖后启动"
    record: "canonical seed sha256 + 每 run 初态 sha256 + 共享 build 前后 sha256"

  metrics:
    primary: "fire_control_opportunity_rate_active = episode_window_metrics.ticks_fire_control_opportunity / episode_window_metrics.vis_ticks_total"
    active_visibility: "episode_window_metrics.vis_ticks_visible / episode_window_metrics.vis_ticks_total"
    env_occ_given_visible: "episode_window_metrics.ticks_fire_control_opportunity / episode_window_metrics.vis_ticks_visible"
    active_window: "episode_windows[0].enter_s / leave_s / leave_s - enter_s"
    first_fco_s: "episode_window_metrics.first_fire_control_opportunity_s（相对窗口 enter_s）"
    first_envelope_in_s: "episode_window_metrics.first_envelope_in_s"
    timeline: [PX4 Ready for takeoff（own / intruder）, release_control / 接管控制权,
               start OK -> AIR_SEARCH, "intruder OFFBOARD 相位 [tw=...]",
               目标观测年龄 age=... / 目标失效策略 / B1 诊断, first envelope_in / first FCO,
               "first SHOT_FIRED t=... / CAPTURE flight=...", active 窗口 enter_s / leave_s / 时长,
               RTF / sim_start / sim_end]
    legacy_descriptive: [arms.json.visibility_rate（window_fixed_v1，含终态后停泊）,
                         arms.json.fire_control_opportunity_rate（window_fixed_v1）]
    decomposition: "active_fco = active_visibility × env_occ_given_visible"

  hard_invariants:
    - "终态类别逐 run 一致（期望 INTERCEPT_CONFIRMED；MISSION_FAILED 属 mission 结果，保留并单列）"
    - "每个 SHOT_FIRED 恰有一个 SHOT_HIT / SHOT_MISS / SHOT_ABORTED；unresolved / duplicated 为空"
    - "事件身份：capture_event ep = task episode id；shot_id epoch 前缀一致；0 条 ep != episode_epoch_ 拒收"
    - "infra 与 mission 分列；infra 不得伪造为任务终态"
    - "跑后无本项目 / ROS 残留；worker 模式下无跨 worker 残留"

  gates:
    a_vs_b:
      hard_invariants: "B 全部通过"
      shared_px4_writable: "B run 期间共享 build 的 dataman / parameters*.bson / px4-rc.params sha256 不变；log/ 文件数与 mtime 不增加"
      infra: "B 总 infra ≤ A 总 infra；A 基线默认 0"
      active_window_enter: "每个 B 的 enter_s 落在 A 的 [min−5 s, max+5 s]"
      active_visibility_floor: 0.90
      active_fco_band: "若 B 全部低于 A min−0.01 或全部高于 A max+0.01 → 粗移提示，需时间线解释"
      unexplained: "关键差异不得为 unexplained"
    p_vs_b:
      hard_invariants: "每个 P worker 全部通过；成对事件身份一致"
      shared_px4_writable: "P 运行期间共享 build 只读；各 worker 私有目录互不共享"
      infra: "每个 P worker infra ≤ B 中位数 / 基线；跨 worker 无残留"
      active_window_enter: "每个 P worker 的 enter_s 落在 B 的 [min−5 s, max+5 s]"
      active_visibility_floor: 0.90
      active_fco_band: "若 P 全部低于 B min−0.01 或全部高于 B max+0.01 → 粗移提示，需时间线解释"
      rtf: "RTF 足以采满 --obs-horizon-s；vis_ticks_total 不低于 B 中位数的 90%"
      cross_worker: "两 worker ROS 图 / gz 话题互不可见；run_id 不碰撞；PX4 lock / 私有目录无冲突"
      unexplained: "关键差异不得为 unexplained"

  attribution_rules:
    startup_state: "active 窗口 enter_s 差异 > 5 s，或 release_control / start OK 墙钟差 > 5 s"
    target_estimation: "shot age > 0.30 s，或 no_pose / behind / rmax / fov 拒绝比例差 > 10 个百分点，或 intruder [tw=] 相位差 > 5 s"
    physical_scatter: "active 可见率 ≥ 0.95，且 env_occ 差异可由 first FCO / 捕获时刻 / 窗口时长解释；无 startup / target 标记"
    unexplained: "不符合以上任一类；unexplained 时不得进入 P"

  retention:
    all_attempts: true
    infra_and_mission_separated: true
    no_retry_substitution: true
    artifacts: [metrics/arms.json, episode summary.json, log/,
                "metrics/fire_control_lifecycle.{json,md}", metrics/px4_writable_isolation.json,
                "config/（计划 sha256、参数初态 sha256、环境矩阵）"]

  fallback:
    - "任一硬不变量失败 → 保留单 worker，不启动 P"
    - "共享 PX4 可写文件被写入 → 隔离失败，先修 B1–B4"
    - "A/B 粗移或存在 unexplained → 保留单 worker，不启动 P"
    - "P 失败或成本 / 收益不值得 → 显式接受单 worker；ADR-0024 保持 deferred 或写明新状态；另立执行规格"

  deviations: []
